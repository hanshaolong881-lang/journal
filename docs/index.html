<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日省</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#999;font-family:Georgia,"Noto Serif SC",serif;-webkit-font-smoothing:antialiased}

#gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;gap:24px;background:linear-gradient(180deg,#0a0a0a 0%,#0d0d0d 50%,#0a0a0a 100%)}
#gate h2{font-size:48px;font-weight:400;color:#c9a84c;letter-spacing:16px;text-transform:uppercase}
#gate .sub{font-size:12px;color:#554820;letter-spacing:8px;margin-bottom:32px}
#gate input{background:#111;border:1px solid #222;color:#aaa;padding:16px 28px;font-size:14px;border-radius:4px;width:280px;outline:none;text-align:center;transition:border-color .3s}
#gate input:focus{border-color:#c9a84c}
#gate button{background:transparent;color:#c9a84c;border:1px solid #c9a84c;padding:14px 48px;font-size:13px;letter-spacing:4px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .3s}
#gate button:hover{background:#c9a84c;color:#0a0a0a}
#gate .err{color:#a04040;font-size:12px;display:none;letter-spacing:2px}

#app{display:none;max-width:680px;margin:0 auto;padding:80px 24px 160px}
header{padding-bottom:32px;margin-bottom:48px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:flex-end}
@media(max-width:640px){
  #gate h2{font-size:36px;letter-spacing:8px}
  #gate input{width:240px;padding:14px 20px}
  #gate button{padding:12px 36px}
  #app{padding:48px 20px 120px}
  header{flex-direction:column;align-items:flex-start;gap:16px}
  h1{font-size:24px}
  .entry::before{left:-16px}
  .entry-card{padding:24px}
  .note-card{padding:20px}
}
h1{font-size:28px;font-weight:400;color:#c9a84c;letter-spacing:12px}
header p{color:#443;font-size:11px;letter-spacing:4px;text-transform:uppercase}
#newBtn{background:transparent;color:#665522;border:1px solid #222;padding:8px 22px;font-size:11px;letter-spacing:3px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .3s}
#newBtn:hover{color:#c9a84c;border-color:#c9a84c}

.entries{display:flex;flex-direction:column;gap:64px}

.entry{position:relative}
.entry::before{content:"";position:absolute;left:-24px;top:4px;width:1px;height:20px;background:#c9a84c;opacity:.3}
.entry-date{font-size:12px;color:#554420;letter-spacing:4px;margin-bottom:0;font-family:monospace;cursor:pointer;transition:color .3s;user-select:none;display:flex;align-items:center;gap:10px}
.entry-date:hover{color:#c9a84c}
.entry-date .arrow{display:inline-block;transition:transform .3s;font-size:9px;color:#c9a84c;opacity:.5}
.entry-date.open .arrow{transform:rotate(90deg)}
.entry-date .count{font-size:10px;color:#443;letter-spacing:1px}

.notes-wrap{display:none;margin-top:16px;display:flex;flex-direction:column;gap:16px}
.notes-wrap.open{display:flex}

.note-card{background:#0d0d0d;border:1px solid #161616;padding:28px 36px;position:relative}
.note-card::after{content:"";position:absolute;top:0;right:0;width:40px;height:1px;background:#c9a84c;opacity:.3}
.note-card .note-title{color:#c9a84c;font-size:13px;font-weight:400;letter-spacing:2px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1a1a1a}
.note-content{font-size:15px;line-height:2.2;color:#888}
.note-content p{margin-bottom:24px}
.note-content p:last-child{margin-bottom:0}
.note-content h3{color:#c9a84c;font-size:17px;font-weight:400;margin-bottom:16px;letter-spacing:2px}
.note-content h4{color:#998;font-size:14px;font-weight:400;margin-bottom:12px}
.note-content ul{margin-bottom:16px;padding-left:20px}
.note-content li{line-height:2;color:#777}

footer{margin-top:120px;padding-top:40px;border-top:1px solid #1a1a1a;color:#333;font-size:10px;letter-spacing:3px;text-align:right}

#editor{display:none;margin-bottom:48px}
.ed-card{background:#0d0d0d;border:1px solid #161616;padding:28px}
.ed-card label{display:block;color:#666;font-size:11px;letter-spacing:2px;margin-bottom:6px;text-transform:uppercase}
.ed-card input{background:#111;border:1px solid #222;color:#aaa;padding:10px 16px;font-size:12px;width:100%;outline:none;font-family:inherit;margin-bottom:12px;transition:border-color .3s}
.ed-card input:focus{border-color:#c9a84c}
.ed-card textarea{width:100%;min-height:200px;background:#111;border:1px solid #222;color:#999;padding:16px;font-size:14px;margin:12px 0;outline:none;resize:vertical;line-height:2;font-family:inherit}
.ed-card textarea:focus{border-color:#c9a84c}
.ed-btns{display:flex;gap:10px}
.ed-btns button{padding:10px 28px;font-size:12px;letter-spacing:3px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .3s}
.btn-save{background:#c9a84c;color:#0a0a0a;border:1px solid #c9a84c}
.btn-save:hover{background:#b8960f}
.btn-cancel{background:transparent;color:#555;border:1px solid #222}
.btn-cancel:hover{color:#888;border-color:#444}
.ed-msg{font-size:11px;margin-top:12px;letter-spacing:1px}
.ed-msg.ok{color:#6a8}
.ed-msg.err{color:#a44}
</style>
</head>
<body>

<div id="gate">
  <h2>日省</h2>
  <div class="sub">DAILY REFLECTION</div>
  <input type="password" id="pw" placeholder="PASSWORD" autofocus>
  <button onclick="unlock()">ENTER</button>
  <div class="err" id="err">ACCESS DENIED</div>
</div>

<div id="app">
  <header>
    <div><h1>日省</h1><p>Daily Reflection</p></div>
    <button id="newBtn" onclick="startNew()">+ Write</button>
  </header>
  <div class="entries" id="entries"></div>

  <div id="editor">
    <div class="ed-card">
      <label>Date</label>
      <input type="text" id="edDate" placeholder="YYYY-MM-DD">
      <label>Title (optional)</label>
      <input type="text" id="edTitle" placeholder="e.g. 晨间反思 / 睡前自省 ...">
      <textarea id="edContent" placeholder="write here..."></textarea>
      <div class="ed-btns">
        <button class="btn-save" onclick="saveEntry()">SAVE</button>
        <button class="btn-cancel" onclick="cancelEdit()">CANCEL</button>
      </div>
      <div class="ed-msg" id="edMsg"></div>
    </div>
  </div>

  <footer>GITHUB.COM/HANSHAOLONG881-LANG/JOURNAL</footer>
</div>

<script>
var HASH = "9b0d0a5be5681bdd2cc700ea65008fe2b8011c9fc41e81606706058fff0197d5";
var TOKEN = "";
var REPO = "hanshaolong881-lang/journal";
var ENTRIES = [{"date": "2026-06-30", "notes": [{"title": "", "content": "<p>\n为自己的认知负责，带杠杆的指数会有磨损不适合长持。\n</p>"}]}, {"date": "2026-06-26", "notes": [{"title": "", "content": "<p>\n最近股市回调了太多。。。心情特别糟糕。总结了以下几点缺点\n</p>\n<p>\n1,没有上涨行情的时候不要抱有幻想，不追高。可以短线做空，但是做空只能玩短线，不过夜\n</p>\n<p>\n2，每一笔交易必须要有理由,！！！一定要有止损！！！没有合适的入场时机千万不能交易，宁愿空仓。也不赌博。\n</p>\n<p>\n3，震荡行情中每一次下跌都是计划，每一次上涨也有做空的机会。\n</p>\n<p>\n4，杠杆做多和做空不能全仓，一定不能全仓。\n</p>\n<p>\n有两本书可以试着看一下，红盘夺金和银盘归流。\n</p>\n<p>\n还有一点对于职场的思考。心态有些问题，太摆烂了，一直都在幻想不干活还拿高工资，这是觉得不可能的。不管是做运营还是做投放。要让领导看到积极性。不要害怕干活！不要抗拒工作！情绪要稳定。没有人会喜欢一个每天啥也不干的人。\n</p>"}]}, {"date": "2026-06-16", "notes": [{"title": "", "content": "<p>\n中国ai科技一部落后步步落后，美国ai高速发展但是现在落地盈利较少。中国会不会发展其他产业来进行对抗。实体行业或者大基建？还是会在ai科技上面追赶。按照国人逻辑，应该会等他们创新后，吸收他们经验。来复制或者抄袭。\n</p>"}]}, {"date": "2026-06-12", "notes": [{"title": "", "content": "<p>\n上天给了我中上的相貌，中上的智商，中上的性格。就是希望我可以通过努力来获得自己想要的。所有的事情，通过努努力都可以做到中上。不要浪费了。\n</p>"}]}, {"date": "2026-06-09", "notes": [{"title": "", "content": "<p>\n06/10 交易规则 系统养成 盘中找机会再进入 没有合适买入机会不追高 宁愿空仓也不动 第二天找高位卖出。\n</p>"}]}, {"date": "2026-06-05", "notes": [{"title": "", "content": "<h3>2026-06-05</h3>\n<p>\n今天开始写日记了。搭建了一个个人网站，用 GitHub Pages 托管，暗色极简风格。希望每天都能记录一点思考和感悟。\n</p>"}]}];
var ghToken = null;

async function sha256(t){
  var b = new TextEncoder().encode(t);
  var h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
}

async function deriveKey(pw){
  var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("journal-key:"+pw));
  return crypto.subtle.importKey("raw", h, {name:"AES-GCM",length:256}, false, ["decrypt"]);
}

async function decryptToken(pw){
  if(!TOKEN) return null;
  try{
    var k = await deriveKey(pw);
    var raw = atob(TOKEN);
    var d = new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) d[i]=raw.charCodeAt(i);
    var n=d.slice(0,12), ct=d.slice(12);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:n}, k, ct);
    return new TextDecoder().decode(pt);
  }catch(e){ return null; }
}

async function unlock(){
  var pw = document.getElementById("pw").value;
  var h = await sha256(pw);
  if(h !== HASH){
    document.getElementById("err").style.display = "block";
    return;
  }
  ghToken = await decryptToken(pw);
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  if(!ghToken) document.getElementById("newBtn").style.display = "none";
  render();
}

function render(){
  var c = document.getElementById("entries");
  c.innerHTML = "";
  ENTRIES.forEach(function(e){
    var d = document.createElement("div");
    d.className = "entry";
    
    var notes = e.notes || [];
    var countHtml = notes.length > 1 ? ' <span class="count">'+notes.length+' notes</span>' : '';
    
    var notesWrap = document.createElement("div");
    notesWrap.className = "notes-wrap";
    
    notes.forEach(function(note, idx){
      var nc = document.createElement("div");
      nc.className = "note-card";
      var titleHtml = note.title ? '<div class="note-title">'+note.title+'</div>' : '';
      nc.innerHTML = titleHtml + '<div class="note-content">'+note.content+'</div>';
      notesWrap.appendChild(nc);
    });
    
    d.innerHTML = '<div class="entry-date" onclick="toggleEntry(this)"><span class="arrow">&#9654;</span> '+e.date + countHtml + '</div>';
    d.appendChild(notesWrap);
    c.appendChild(d);
  });
}

function toggleEntry(el){
  el.classList.toggle("open");
  var wrap = el.parentElement.querySelector(".notes-wrap");
  if(wrap) wrap.classList.toggle("open");
}

function openFirstEntry(){
  var firstDate = document.querySelector(".entry-date");
  if(firstDate) toggleEntry(firstDate);
}

async function reloadEntries(){
  try{
    var r = await fetch("https://api.github.com/repos/"+REPO+"/contents/entries/",{
      headers:{"Authorization":"Bearer "+ghToken,Accept:"application/vnd.github+json"}
    });
    if(!r.ok) return;
    var files = await r.json();
    var dateMap = {};
    // sort files newest first
    files.sort(function(a,b){ return b.name.localeCompare(a.name); });
    for(var i=0;i<files.length;i++){
      var f = files[i];
      if(!f.name.endsWith(".md")) continue;
      var date = f.name.replace(".md","");
      var cr = await fetch(f.download_url);
      var raw = await cr.text();
      // Split by --- for multiple notes
      var notes = raw.split("\n---\n").filter(function(s){ return s.trim(); });
      
      var noteList = [];
      notes.forEach(function(note){
        note = note.trim();
        var lines = note.split("\n");
        var title = "";
        var bodyLines = [];
        if(lines.length > 0 && lines[0].startsWith("# ")){
          title = lines[0].slice(2);
          bodyLines = lines.slice(1);
        } else {
          bodyLines = lines;
        }
        var body = bodyLines.join("\n").trim() || note;
        var html = simpleMdToHtml(body);
        noteList.push({title: title, content: html});
      });
      dateMap[date] = {date: date, notes: noteList};
    }
    var dates = Object.keys(dateMap).sort().reverse();
    ENTRIES = dates.map(function(d){ return dateMap[d]; });
    document.getElementById("entries").innerHTML = "";
    render();
    openFirstEntry();
  }catch(e){}
}

function simpleMdToHtml(raw){
  var html = "";
  var inP = false, inUl = false;
  raw.split("\n").forEach(function(line){
    line = line.trim();
    if(!line){
      if(inP){ html += "</p>"; inP = false; }
      if(inUl){ html += "</ul>"; inUl = false; }
      return;
    }
    if(line.startsWith("# ")){
      if(inP){ html += "</p>"; inP = false; }
      if(inUl){ html += "</ul>"; inUl = false; }
      html += "<h3>" + line.slice(2) + "</h3>";
      return;
    }
    if(line.startsWith("## ")){
      if(inP){ html += "</p>"; inP = false; }
      if(inUl){ html += "</ul>"; inUl = false; }
      html += "<h4>" + line.slice(3) + "</h4>";
      return;
    }
    if(line.startsWith("- ")){
      if(inP){ html += "</p>"; inP = false; }
      if(!inUl){ html += "<ul>"; inUl = true; }
      html += "<li>" + line.slice(2) + "</li>";
      return;
    }
    if(inUl){ html += "</ul>"; inUl = false; }
    if(!inP){ html += "<p>"; inP = true; }
    html += line + " ";
  });
  if(inP) html += "</p>";
  if(inUl) html += "</ul>";
  return html;
}

function startNew(){
  if(!ghToken){ alert("Token not loaded"); return; }
  document.getElementById("edDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("edTitle").value = "";
  document.getElementById("edContent").value = "";
  document.getElementById("edMsg").textContent = "";
  document.getElementById("edMsg").className = "ed-msg";
  document.getElementById("editor").style.display = "block";
  window.scrollTo(0,0);
}

function cancelEdit(){
  document.getElementById("editor").style.display = "none";
}

async function saveEntry(){
  var date = document.getElementById("edDate").value.trim();
  var title = document.getElementById("edTitle").value.trim();
  var content = document.getElementById("edContent").value.trim();
  var msg = document.getElementById("edMsg");
  if(!date||!content){ msg.className="ed-msg err"; msg.textContent="Fill date and content"; return; }
  msg.className="ed-msg"; msg.textContent="Saving...";
  
  // Build the full note string
  var newBlock = "";
  if(title) newBlock += "# " + title + "\n\n";
  newBlock += content;
  
  try{
    // Check if file already exists
    var sha = null;
    var existingContent = "";
    try{
      var r = await fetch("https://api.github.com/repos/"+REPO+"/contents/entries/"+date+".md",{
        headers:{"Authorization":"Bearer "+ghToken,Accept:"application/vnd.github+json"}
      });
      if(r.ok){
        var d = await r.json();
        sha = d.sha;
        // Get existing content
        existingContent = atob(d.content.replace(/\n/g,""));
        try {
          existingContent = decodeURIComponent(escape(existingContent));
        } catch(e) {}
        existingContent = existingContent.trim();
      }
    }catch(e){}
    
    // If file exists, APPEND with --- separator
    var finalContent;
    if(sha && existingContent){
      finalContent = existingContent + "\n\n---\n\n" + newBlock;
    } else {
      finalContent = newBlock;
    }
    
    var body = {
      message: "journal " + date,
      content: btoa(unescape(encodeURIComponent(finalContent))),
      branch: "master"
    };
    if(sha) body.sha = sha;
    
    var resp = await fetch("https://api.github.com/repos/"+REPO+"/contents/entries/"+date+".md",{
      method:"PUT",
      headers:{"Authorization":"Bearer "+ghToken,Accept:"application/vnd.github+json","Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    
    if(resp.ok){
      var action = sha ? "Appended" : "Saved";
      msg.className="ed-msg ok"; msg.textContent = action + "! Refreshing...";
      cancelEdit();
      setTimeout(function(){ reloadEntries(); }, 1500);
    }else{
      var err = await resp.json();
      msg.className="ed-msg err"; msg.textContent = "Error: "+(err.message||"unknown");
    }
  }catch(e){
    msg.className="ed-msg err"; msg.textContent = "Network error: "+e.message;
  }
}

document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter") unlock();
});
</script>
</body>
</html>
