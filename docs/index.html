<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日省</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080a;color:#a8a4b0;font-family:Georgia,"Noto Serif SC",serif;-webkit-font-smoothing:antialiased}
#gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;gap:20px;background:radial-gradient(ellipse at 50% 30%,rgba(80,60,200,0.06),transparent 70%),#08080a}
#gate h2{font-size:56px;font-weight:400;color:#e8e4e0;letter-spacing:12px}
#gate .sub{font-size:14px;color:#5a5568;letter-spacing:6px;margin-bottom:24px}
#gate input{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:#c8c4c0;padding:14px 24px;font-size:15px;border-radius:12px;width:260px;outline:none;text-align:center}
#gate input:focus{border-color:rgba(180,160,220,0.3);background:rgba(255,255,255,0.05)}
#gate button{background:rgba(255,255,255,0.06);color:#d0cce0;border:1px solid rgba(255,255,255,0.08);padding:12px 32px;font-size:14px;border-radius:12px;cursor:pointer;font-family:inherit;letter-spacing:2px}
#gate button:hover{background:rgba(255,255,255,0.1)}
#gate .err{color:#c06060;font-size:13px;display:none}
#app{display:none;max-width:720px;margin:0 auto;padding:80px 28px 160px}
header{padding-bottom:48px;margin-bottom:64px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:flex-end}
h1{font-size:32px;font-weight:400;color:#e8e4e0;letter-spacing:8px}
header p{color:#5a5568;font-size:13px;letter-spacing:3px}
#newBtn{background:rgba(255,255,255,0.04);color:#a098b0;border:1px solid rgba(255,255,255,0.06);padding:8px 20px;font-size:12px;border-radius:10px;cursor:pointer;font-family:inherit;letter-spacing:1px;transition:all .3s}
#newBtn:hover{background:rgba(255,255,255,0.08);border-color:rgba(180,160,220,0.25);color:#d0cce0}
.entries{display:flex;flex-direction:column;gap:56px}
.entry-date{font-size:11px;color:#3d3850;letter-spacing:3px;margin-bottom:20px}
.entry-content{font-size:16px;line-height:2.1;color:#a8a4b0}
.entry-content p{margin-bottom:20px}
.entry-content h3{color:#d0cce0;font-size:19px;font-weight:400;margin-bottom:12px}
footer{margin-top:120px;padding-top:32px;border-top:1px solid rgba(255,255,255,0.03);color:#3d3850;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>

<div id="gate">
  <h2>日省</h2>
  <div class="sub">TONG SHAPAI</div>
  <input type="password" id="pw" placeholder="密码" autofocus>
  <button onclick="unlock()">进入</button>
  <div class="err" id="err">密码错误</div>
</div>

<div id="app">
  <header>
    <div><h1>日省</h1><p>每日感悟</p></div>
    <button id="newBtn" onclick="startNew()">+ 写日记</button>
  </header>

  <div class="entries" id="entries"></div>
  <footer>github.com/hanshaolong881-lang/journal</footer>
</div>

<script>
var HASH = "9b0d0a5be5681bdd2cc700ea65008fe2b8011c9fc41e81606706058fff0197d5";
var ENTRIES = [{"date": "2026-06-05", "content": "<h3>2026-06-05</h3>\n<p>\n今天开始写日记了。搭建了一个个人网站，用 GitHub Pages 托管，暗色极简风格。希望每天都能记录一点思考和感悟。\n</p>"}];

async function sha256(t){
  var b = new TextEncoder().encode(t);
  var h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
}

async function unlock(){
  var pw = document.getElementById("pw").value;
  var h = await sha256(pw);
  if(h !== HASH){
    document.getElementById("err").style.display = "block";
    return;
  }
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
}

function render(){
  var c = document.getElementById("entries");
  ENTRIES.forEach(function(e){
    var d = document.createElement("div");
    d.innerHTML = '<div class="entry-date">'+e.date+'</div><div class="entry-content">'+e.content+'</div>';
    c.appendChild(d);
  });
}

document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter") unlock();
});
</script>
</body>
</html>
