<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日省">
<title>日省 · Daily Reflection</title>
<link rel="icon" href="./assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont@1.7.0/style.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css" media="print" onload="this.media='all'">
<style>
:root {
  color-scheme: dark;
  --gold: #d8b85f;
  --gold-bright: #ebd082;
  --gold-muted: #a69058;
  --gold-dim: #7e6d42;
  --gold-line: rgba(216, 184, 95, 0.24);
  --text-main: #d6cebe;
  --text-strong: #ece5d5;
  --text-muted: #9a9180;
  --card-bg: linear-gradient(145deg, rgba(22, 21, 19, 0.78), rgba(12, 12, 14, 0.86));
  --card-border: rgba(255, 255, 255, 0.11);
  --danger: #d46a6a;
  --ok: #75b896;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100dvh;
  background-color: #060608;
  color: var(--text-main);
  font-family: "LXGW WenKai Screen", "LXGW WenKai", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
  font-size: 17px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* GPU-friendly fixed background layer (avoids iOS/Android background-attachment:fixed bugs) */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-color: #050507;
  background-image:
    linear-gradient(90deg, rgba(4, 4, 6, 0.85) 0%, rgba(8, 8, 10, 0.65) 46%, rgba(4, 4, 6, 0.90) 100%),
    radial-gradient(circle at 26% 12%, rgba(201, 168, 76, 0.15), transparent 34%),
    image-set(
      url("./assets/maybach-bg.webp") type("image/webp"),
      url("./assets/maybach-bg.jpg") type("image/jpeg")
    );
  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;
  transform: translateZ(0);
}

/* Focus visibility for keyboard & accessibility */
button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 1px solid var(--gold);
  outline-offset: 2px;
}

/* Gate / Unlock Screen */
#gate {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 24px;
  background: linear-gradient(180deg, rgba(5, 5, 7, 0.78) 0%, rgba(10, 10, 12, 0.62) 50%, rgba(5, 5, 7, 0.88) 100%);
}

.gate-form {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
  max-width: 340px;
}

#gate h2 {
  font-size: 46px;
  font-weight: 400;
  color: var(--gold);
  letter-spacing: 16px;
  padding-left: 16px;
  text-shadow: 0 0 28px rgba(201, 168, 76, 0.18);
}

#gate .sub {
  font-size: 12px;
  color: var(--gold-muted);
  letter-spacing: 7px;
  padding-left: 7px;
  margin-bottom: 16px;
}

#gate input[type="password"] {
  background: rgba(14, 14, 16, 0.88);
  border: 1px solid rgba(216, 184, 95, 0.24);
  color: var(--text-strong);
  padding: 15px 24px;
  font-size: 15px;
  border-radius: 6px;
  width: 100%;
  text-align: center;
  letter-spacing: 3px;
  transition: border-color 0.25s, box-shadow 0.25s;
}

#gate input[type="password"]::placeholder {
  color: #6e6656;
  letter-spacing: 4px;
}

#gate input[type="password"]:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12);
  outline: none;
}

.remember-row {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  letter-spacing: 1px;
}

.remember-row input {
  accent-color: var(--gold);
  width: 14px;
  height: 14px;
  cursor: pointer;
}

#gate button[type="submit"] {
  width: 100%;
  background: rgba(201, 168, 76, 0.08);
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 6px;
  padding: 13px 36px;
  font-size: 13px;
  letter-spacing: 5px;
  padding-left: 41px;
  cursor: pointer;
  font-family: inherit;
  text-transform: uppercase;
  transition: all 0.25s;
}

#gate button[type="submit"]:hover {
  background: var(--gold);
  color: #09090b;
}

#gate .err {
  color: var(--danger);
  font-size: 12px;
  display: none;
  letter-spacing: 2px;
}

/* Main App Container */
#app {
  display: none;
  max-width: 860px;
  margin: 0 auto;
  padding: 68px 28px 130px;
}

header {
  padding-bottom: 26px;
  margin-bottom: 24px;
  border-bottom: 1px solid rgba(216, 184, 95, 0.18);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
}

.brand-wrap h1 {
  font-size: 38px;
  font-weight: 500;
  color: var(--gold);
  letter-spacing: 12px;
  line-height: 1.2;
  text-shadow: 0 0 24px rgba(201, 168, 76, 0.14);
}

.brand-sub {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 6px;
  color: var(--gold-muted);
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.sync-badge {
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  text-transform: none;
}

.sync-badge.ok {
  color: var(--ok);
  border-color: rgba(117, 184, 150, 0.25);
}

.sync-badge.busy {
  color: var(--gold);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-top {
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-muted);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 6px;
  padding: 9px 16px;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.22s;
}

.btn-top:hover {
  color: var(--gold);
  border-color: var(--gold);
  background: rgba(216, 184, 95, 0.07);
}

.btn-top.primary {
  color: var(--gold);
  border-color: rgba(216, 184, 95, 0.55);
  background: rgba(216, 184, 95, 0.09);
}

.btn-top.primary:hover {
  background: var(--gold);
  color: #09090b;
}

/* Stats Strip */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}

.stat-item {
  padding: 14px 16px;
  border-radius: 12px;
  background: rgba(18, 18, 20, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.stat-value {
  font-size: 19px;
  color: var(--gold);
  font-weight: 500;
  letter-spacing: 1px;
}

/* Editor (Placed at top for immediate visibility) */
#editor {
  display: none;
  margin-bottom: 28px;
}

.ed-card {
  background: var(--card-bg);
  border: 1px solid rgba(216, 184, 95, 0.28);
  border-radius: 16px;
  padding: 26px 28px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.48);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.ed-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.ed-heading {
  color: var(--gold);
  font-size: 16px;
  letter-spacing: 2px;
  font-weight: 500;
}

.draft-hint {
  font-size: 12px;
  color: var(--text-muted);
}

.ed-grid {
  display: grid;
  grid-template-columns: 190px 1fr;
  gap: 14px;
  margin-bottom: 12px;
}

.ed-field label {
  display: block;
  color: var(--gold-muted);
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.ed-card input[type="date"],
.ed-card input[type="text"] {
  background: rgba(0, 0, 0, 0.36);
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 6px;
  color: var(--text-strong);
  padding: 10px 14px;
  font-size: 14px;
  width: 100%;
  font-family: inherit;
  transition: border-color 0.25s;
}

.ed-card input:focus,
.ed-card textarea:focus {
  border-color: var(--gold);
  outline: none;
}

.prompt-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0 12px;
}

.chip {
  background: rgba(216, 184, 95, 0.07);
  border: 1px solid rgba(216, 184, 95, 0.22);
  color: var(--gold-muted);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}

.chip:hover {
  color: var(--gold-bright);
  border-color: var(--gold);
  background: rgba(216, 184, 95, 0.15);
}

.ed-card textarea {
  width: 100%;
  min-height: 220px;
  background: rgba(0, 0, 0, 0.36);
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 8px;
  color: var(--text-strong);
  padding: 16px;
  font-size: 16px;
  margin: 4px 0 14px;
  resize: vertical;
  line-height: 1.95;
  font-family: inherit;
}

.ed-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.ed-btns {
  display: flex;
  gap: 10px;
  align-items: center;
}

.ed-btns button {
  padding: 10px 24px;
  font-size: 13px;
  letter-spacing: 2px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.22s;
}

.btn-save {
  background: var(--gold);
  color: #09090b;
  border: 1px solid var(--gold);
  font-weight: 600;
}

.btn-save:hover:not(:disabled) {
  background: var(--gold-bright);
}

.btn-save:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-cancel {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-cancel:hover {
  color: var(--text-strong);
  border-color: rgba(255, 255, 255, 0.35);
}

.word-count {
  font-size: 12px;
  color: var(--text-muted);
}

.ed-msg {
  font-size: 12px;
  margin-top: 10px;
  letter-spacing: 1px;
}

.ed-msg.ok {
  color: var(--ok);
}

.ed-msg.err {
  color: var(--danger);
}

/* Search & Date Filters */
.filters {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
  gap: 12px;
  align-items: end;
  margin: 0 0 36px;
  padding: 18px 20px;
  border-radius: 14px;
  border: 1px solid var(--card-border);
  background: rgba(18, 18, 20, 0.76);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.search-row {
  grid-column: 1 / -1;
  position: relative;
}

.search-row input {
  width: 100%;
  min-height: 42px;
  padding: 0 38px 0 14px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(0, 0, 0, 0.34);
  color: var(--text-strong);
  font: inherit;
  font-size: 14px;
}

.search-row input::placeholder {
  color: #777062;
}

.search-row input:focus {
  border-color: var(--gold);
  outline: none;
}

.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 16px;
  padding: 4px 8px;
  cursor: pointer;
  display: none;
}

.filters label {
  display: grid;
  gap: 6px;
  color: var(--gold-muted);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.filters label input {
  min-height: 40px;
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 6px;
  padding: 0 10px;
  color: var(--text-strong);
  background: rgba(0, 0, 0, 0.34);
  font: inherit;
  font-size: 13px;
}

.filters label input:focus {
  border-color: var(--gold);
  outline: none;
}

.filter-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-actions button {
  min-height: 40px;
  padding: 0 13px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--gold);
  background: rgba(255, 255, 255, 0.04);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 1px;
  transition: all 0.2s;
  white-space: nowrap;
}

.filter-actions button:hover {
  border-color: var(--gold);
  background: rgba(216, 184, 95, 0.11);
}

.filter-summary-row {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding-top: 4px;
  color: var(--text-muted);
  font-size: 12px;
  letter-spacing: 1px;
}

.btn-link {
  background: none;
  border: none;
  color: var(--gold-muted);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  letter-spacing: 1px;
}

.btn-link:hover {
  color: var(--gold);
  text-decoration: underline;
}

/* Timeline & Entries */
.entries {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 28px;
  padding-left: 18px;
}

.entries::before {
  content: "";
  position: absolute;
  left: 3px;
  top: 10px;
  bottom: 10px;
  width: 1px;
  background: linear-gradient(180deg, rgba(216, 184, 95, 0.42), rgba(216, 184, 95, 0.08));
}

.entry {
  position: relative;
}

.entry::before {
  content: "";
  position: absolute;
  left: -18px;
  top: 10px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #171510;
  border: 1.5px solid var(--gold);
  transition: background 0.25s, transform 0.25s;
}

.entry:has(.entry-date.open)::before {
  background: var(--gold);
  transform: scale(1.18);
}

.entry-date {
  width: 100%;
  background: transparent;
  border: none;
  text-align: left;
  padding: 4px 0;
  font-size: 15px;
  color: var(--gold-muted);
  letter-spacing: 2px;
  font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
  cursor: pointer;
  transition: color 0.25s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.entry-date:hover,
.entry-date.open {
  color: var(--gold);
}

.entry-date .arrow {
  display: inline-block;
  transition: transform 0.25s;
  font-size: 10px;
  color: var(--gold);
  opacity: 0.75;
}

.entry-date.open .arrow {
  transform: rotate(90deg);
}

.entry-date .weekday {
  font-family: "LXGW WenKai Screen", "Noto Serif SC", serif;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 1px;
}

.entry-date .count {
  font-family: "LXGW WenKai Screen", "Noto Serif SC", serif;
  font-size: 11px;
  color: var(--gold-muted);
  background: rgba(216, 184, 95, 0.09);
  border: 1px solid rgba(216, 184, 95, 0.18);
  padding: 1px 8px;
  border-radius: 999px;
  letter-spacing: 1px;
}

.notes-wrap {
  display: none;
  margin-top: 14px;
  flex-direction: column;
  gap: 16px;
}

.notes-wrap.open {
  display: flex;
}

.note-card {
  overflow: hidden;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 30px 36px;
  position: relative;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.note-card::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 96px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(216, 184, 95, 0.65));
}

.note-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}

.note-top.no-title {
  margin-bottom: 8px;
  padding-bottom: 0;
  border-bottom: none;
  justify-content: flex-end;
}

.note-title {
  color: var(--gold);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 1.5px;
}

.note-tools {
  display: flex;
  gap: 6px;
  opacity: 0.55;
  transition: opacity 0.2s;
  flex-shrink: 0;
}

.note-card:hover .note-tools,
.note-tools:focus-within {
  opacity: 1;
}

.note-tool-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.10);
  color: var(--text-muted);
  border-radius: 5px;
  padding: 3px 9px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}

.note-tool-btn:hover {
  color: var(--gold);
  border-color: var(--gold);
}

.note-tool-btn.danger:hover {
  color: var(--danger);
  border-color: var(--danger);
}

.note-content {
  font-size: 17.5px;
  line-height: 2.02;
  color: var(--text-main);
  letter-spacing: 0.2px;
  word-break: break-word;
}

.note-content p {
  margin-bottom: 20px;
}

.note-content p:last-child {
  margin-bottom: 0;
}

.note-content h3 {
  color: var(--gold);
  font-size: 21px;
  font-weight: 500;
  margin: 10px 0 14px;
  letter-spacing: 1.5px;
}

.note-content h4 {
  color: #cbb882;
  font-size: 18px;
  font-weight: 500;
  margin: 8px 0 12px;
}

.note-content ul,
.note-content ol {
  margin: 0 0 18px;
  padding-left: 24px;
}

.note-content li {
  line-height: 1.95;
  color: var(--text-main);
  margin-bottom: 6px;
}

.note-content blockquote {
  margin: 0 0 18px;
  padding: 10px 16px;
  border-left: 2px solid var(--gold);
  background: rgba(216, 184, 95, 0.05);
  color: #c7bca5;
  border-radius: 0 8px 8px 0;
}

.note-content strong {
  color: var(--text-strong);
  font-weight: 600;
}

.note-content code {
  font-family: "Cascadia Mono", Consolas, monospace;
  font-size: 0.9em;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.07);
  color: var(--gold-bright);
}

mark.hl {
  background: rgba(216, 184, 95, 0.28);
  color: #fff6dc;
  padding: 0 2px;
  border-radius: 3px;
}

.empty-state {
  padding: 48px 20px;
  border: 1px dashed rgba(216, 184, 95, 0.22);
  border-radius: 16px;
  color: var(--gold-muted);
  text-align: center;
  letter-spacing: 2px;
  font-size: 14px;
  background: rgba(18, 18, 20, 0.58);
}

footer {
  margin-top: 96px;
  padding-top: 28px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  color: #6f6859;
  font-size: 11px;
  letter-spacing: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

/* Mobile Responsive Overrides — MUST remain at the bottom of stylesheet */
@media (max-width: 720px) {
  #gate h2 {
    font-size: 36px;
    letter-spacing: 10px;
    padding-left: 10px;
  }
  #app {
    padding: 36px 16px 96px;
  }
  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }
  .brand-wrap h1 {
    font-size: 30px;
    letter-spacing: 8px;
  }
  .header-actions {
    width: 100%;

<div class="bg-layer" aria-hidden="true"></div>

<div id="gate">
  <form class="gate-form" onsubmit="event.preventDefault(); unlock();">

    <div class="sub">DAILY REFLECTION</div>
    <input type="password" id="pw" aria-label="访问密码" placeholder="输入密码解锁" autocomplete="current-password" autofocus>
    <label class="remember-row">
      <input type="checkbox" id="rememberChk">
      <span>在此设备保持解锁 7 天</span>
    </label>
    <button type="submit">进入日省</button>
    <div class="err" id="err">密码不正确，请重试</div>
  </form>
</div>

<div id="app">
  <header>
    <div class="brand-wrap">
      <h1>日省</h1>
      <div class="brand-sub">
        <span>Daily Reflection</span>
        <span class="sync-badge" id="syncBadge">本地就绪</span>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-top primary" id="newBtn" onclick="startNew()">+ 写日省</button>
      <button type="button" class="btn-top" onclick="exportMarkdown()">导出备份</button>
      <button type="button" class="btn-top" onclick="lockApp()">锁定</button>
    </div>
  </header>

  <section class="stats-strip" aria-label="自省统计">
    <div class="stat-item">
      <div class="stat-label">累计天数</div>
      <div class="stat-value" id="statDays">0 天</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">累计篇数</div>
      <div class="stat-value" id="statNotes">0 篇</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">本月自省</div>
      <div class="stat-value" id="statMonth">0 篇</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">最近状态</div>
      <div class="stat-value" id="statLatest">—</div>
    </div>
  </section>

  <div id="editor">
    <div class="ed-card">
      <div class="ed-header">
        <span class="ed-heading" id="edHeading">撰写新日省</span>
        <span class="draft-hint" id="draftHint">支持 Markdown · Ctrl+Enter 保存</span>
      </div>
      <div class="ed-grid">
        <div class="ed-field">
          <label for="edDate">日期</label>
          <input type="date" id="edDate">
        </div>
        <div class="ed-field">
          <label for="edTitle">主题（选填）</label>
          <input type="text" id="edTitle" placeholder="如：晨间立意 / 交易复盘 / 睡前自省…">
        </div>
      </div>
      <div class="prompt-chips" aria-label="快捷主题">
        <button type="button" class="chip" onclick="applyPrompt('晨间立意')">晨间立意</button>
        <button type="button" class="chip" onclick="applyPrompt('交易复盘')">交易复盘</button>
        <button type="button" class="chip" onclick="applyPrompt('言行自省')">言行自省</button>
        <button type="button" class="chip" onclick="applyPrompt('读书札记')">读书札记</button>
        <button type="button" class="chip" onclick="applyPrompt('睡前复盘')">睡前复盘</button>
      </div>
      <textarea id="edContent" placeholder="吾日三省吾身……（支持 # 标题、- 列表、1. 编号、> 引用、**加粗**）"></textarea>
      <div class="ed-footer">
        <div class="ed-btns">
          <button type="button" class="btn-save" id="saveBtn" onclick="saveEntry()">保存发布</button>
          <button type="button" class="btn-cancel" onclick="cancelEdit()">取消</button>
        </div>
        <span class="word-count" id="wordCount">0 字</span>
      </div>
      <div class="ed-msg" id="edMsg"></div>
    </div>
  </div>

  <section class="filters" aria-label="搜索与日期筛选">
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="搜索关键词、主题或日期…" oninput="onSearchInput()">
      <button type="button" class="search-clear" id="searchClear" aria-label="清空搜索" onclick="clearSearch()">×</button>
    </div>
    <label>起始日期
      <input type="date" id="fromDate" onchange="onDateRangeChange()">
    </label>
    <label>结束日期
      <input type="date" id="toDate" onchange="onDateRangeChange()">
    </label>
    <label class="month-field">按月查看
      <input type="month" id="monthFilter" onchange="setMonthFilter(this.value)">
    </label>
    <div class="filter-actions">
      <button type="button" onclick="showAllEntries()">全部</button>
      <button type="button" onclick="showLatestMonth()">最近一月</button>
    </div>
    <div class="filter-summary-row">
      <span id="filterSummary"></span>
      <button type="button" class="btn-link" id="toggleAllBtn" onclick="toggleAllEntries()">全部展开</button>
    </div>
  </section>

  <div class="entries" id="entries"></div>

  <footer>
    <span>吾日三省吾身 · DAILY REFLECTION</span>
    <span>hanshaolong881-lang/journal</span>
  </footer>
</div>

，有张力，有边界感，有力量。平位是置顶不了规则的，高位才可以制定规则。不用去谁女方设定一个乖的框架，太乖的话对方就是舒适圈。不会有什么作为。这对于推进关系不利。要不然就是她被动等待我们做动作。她在高位。","content":"<p>社交本身就是一个高频高密高反馈的行为，要根据事实反馈去调整策略。做的每一步都要有目的和收口。一般有刺激情绪，塑造价值，创造前置位。做的每个动作都应该有意义。去体现自己有进攻性，有价值感，有张力，有边界感，有力量。平位是置顶不了规则的，高位才可以制定规则。不用去谁女方设定一个乖的框架，太乖的话对方就是舒适圈。不会有什么作为。这对于推进关系不利。要不然就是她被动等待我们做动作。她在高位。</p>"},{"title":"","raw":"主动是一件很难的事情。主动加自律。获得快乐的方式不要太容易。主动去做一些事情。人这一辈子有七次改变命运的机会。抓住一次就可以改变命运。有些人被动等待着接受，有些人主动去做一些准备。所以就会有完全不同的人生。好的东西想要获得必须付出一定的代价。如果太容易来的不一定就是好的。付出的代价越高，得到的也就越多。","content":"<p>主动是一件很难的事情。主动加自律。获得快乐的方式不要太容易。主动去做一些事情。人这一辈子有七次改变命运的机会。抓住一次就可以改变命运。有些人被动等待着接受，有些人主动去做一些准备。所以就会有完全不同的人生。好的东西想要获得必须付出一定的代价。如果太容易来的不一定就是好的。付出的代价越高，得到的也就越多。</p>"}]},{"date":"2026-08-14","notes":[{"title":"","raw":"好久没上来写过东西了。总结一下最近的情况吧。遇到了新的人，感到到了热情与真诚。1600成本的闪迪最近也快回本了。今天又想到了一个观点。个股的涨跌是无法被预测的，没有人可以完美的猜中每天的涨跌，也不存在完美的交易。我们能做的只有判断资金的成本，资金的流向，以及行业的趋势及，地缘政治的缓和，以及市场过往走出的趋势。再去预判接下来市场的走势。没有一直涨的票，也没有一直跌的票。所以不要被当天的涨跌影响到心情，也不要每天都去频繁操作。巴菲特的投资理念之一就是以合适的价格买到优秀的公司。所以频繁交易对于散户来说是不对的。现在的美光，闪迪，迈威尔，英伟达，spex。这些都是好公司，但是目前市场给你估值也很高。如果涨势已经起来再去追这就是不对的。根据涨跌去买卖更是错中之错。买入的前提是价格合适加上公司优质。十年后还能稳定。","content":"<p>好久没上来写过东西了。总结一下最近的情况吧。遇到了新的人，感到到了热情与真诚。1600成本的闪迪最近也快回本了。今天又想到了一个观点。个股的涨跌是无法被预测的，没有人可以完美的猜中每天的涨跌，也不存在完美的交易。我们能做的只有判断资金的成本，资金的流向，以及行业的趋势及，地缘政治的缓和，以及市场过往走出的趋势。再去预判接下来市场的走势。没有一直涨的票，也没有一直跌的票。所以不要被当天的涨跌影响到心情，也不要每天都去频繁操作。巴菲特的投资理念之一就是以合适的价格买到优秀的公司。所以频繁交易对于散户来说是不对的。现在的美光，闪迪，迈威尔，英伟达，spex。这些都是好公司，但是目前市场给你估值也很高。如果涨势已经起来再去追这就是不对的。根据涨跌去买卖更是错中之错。买入的前提是价格合适加上公司优质。十年后还能稳定。</p>"}]},{"date":"2026-07-21","notes":[{"title":"","raw":"华尔街的资金比大家想的更敏锐。在spex上市之前大家都觉得会大涨。可是当天价格并没有出现大幅度上涨。在三天后开始一路下跌。ai科技股也在资金的狂欢中过上车一样起起伏伏。仿佛这批资金才是世界的改写者。","content":"<p>华尔街的资金比大家想的更敏锐。在spex上市之前大家都觉得会大涨。可是当天价格并没有出现大幅度上涨。在三天后开始一路下跌。ai科技股也在资金的狂欢中过上车一样起起伏伏。仿佛这批资金才是世界的改写者。</p>"},{"title":"","raw":"投资组合的流程应该是分析公司业务和看涨逻辑。选出合适的公司，然后看近期走势。选择建仓位置。建仓位置选好之后在合适位置买入。然后屏蔽掉噪音。基本逻辑没有损坏的情况下。先不急着跑。如果市场情绪很差，并且亏损超过百分之二十。考虑清仓。清仓之后的资金不要急着交易，宁愿空仓等待机会也不乱买。只赚该赚到的钱。在市场情绪好的时候，拿住就是最好的操作。一波周期最起码一两个月。不要被洗出去","content":"<p>投资组合的流程应该是分析公司业务和看涨逻辑。选出合适的公司，然后看近期走势。选择建仓位置。建仓位置选好之后在合适位置买入。然后屏蔽掉噪音。基本逻辑没有损坏的情况下。先不急着跑。如果市场情绪很差，并且亏损超过百分之二十。考虑清仓。清仓之后的资金不要急着交易，宁愿空仓等待机会也不乱买。只赚该赚到的钱。在市场情绪好的时候，拿住就是最好的操作。一波周期最起码一两个月。不要被洗出去</p>"}]},{"date":"2026-06-30","notes":[{"title":"变强的特征","raw":"变强的三个特征：自信，主动，不摆烂。现在才二十几岁的年纪，累一点没什么大不了的，多干一点也没什么大不了。偷过的懒到时候都要以另一种方式回来。人生是很长的。所以不要害怕干活。\n保持高精力的秘诀：戒色，这个太重要了。还有早睡。一个好的身体比任何事情都重要。多跟她聊一些女生感兴趣的话题，除此之外不要闲聊。特别是一些负能量的事情。要保持积极阳光的形象。","content":"<p>变强的三个特征：自信，主动，不摆烂。现在才二十几岁的年纪，累一点没什么大不了的，多干一点也没什么大不了。偷过的懒到时候都要以另一种方式回来。人生是很长的。所以不要害怕干活。<br>保持高精力的秘诀：戒色，这个太重要了。还有早睡。一个好的身体比任何事情都重要。多跟她聊一些女生感兴趣的话题，除此之外不要闲聊。特别是一些负能量的事情。要保持积极阳光的形象。</p>"},{"title":"为自己的认知负责","raw":"为自己的认知负责。带杠杆的etf每天都会有磨损，所以不适合长线，如果早知道有这个逻辑就不会一直耗着不走。","content":"<p>为自己的认知负责。带杠杆的etf每天都会有磨损，所以不适合长线，如果早知道有这个逻辑就不会一直耗着不走。</p>"}]},{"date":"2026-06-26","notes":[{"title":"","raw":"最近股市回调了太多。。。心情特别糟糕。总结了以下几点缺点\n1,没有上涨行情的时候不要抱有幻想，不追高。可以短线做空，但是做空只能玩短线，不过夜\n2，每一笔交易必须要有理由,！！！一定要有止损！！！没有合适的入场时机千万不能交易，宁愿空仓。也不赌博。\n3，震荡行情中每一次下跌都是计划，每一次上涨也有做空的机会。\n4，杠杆做多和做空不能全仓，一定不能全仓。\n有两本书可以试着看一下，红盘夺金和银盘归流。\n还有一点对于职场的思考。心态有些问题，太摆烂了，一直都在幻想不干活还拿高工资，这是觉得不可能的。不管是做运营还是做投放。要让领导看到积极性。不要害怕干活！不要抗拒工作！情绪要稳定。没有人会喜欢一个每天啥也不干的人。","content":"<p>最近股市回调了太多。。。心情特别糟糕。总结了以下几点缺点<br>1,没有上涨行情的时候不要抱有幻想，不追高。可以短线做空，但是做空只能玩短线，不过夜<br>2，每一笔交易必须要有理由,！！！一定要有止损！！！没有合适的入场时机千万不能交易，宁愿空仓。也不赌博。<br>3，震荡行情中每一次下跌都是计划，每一次上涨也有做空的机会。<br>4，杠杆做多和做空不能全仓，一定不能全仓。<br>有两本书可以试着看一下，红盘夺金和银盘归流。<br>还有一点对于职场的思考。心态有些问题，太摆烂了，一直都在幻想不干活还拿高工资，这是觉得不可能的。不管是做运营还是做投放。要让领导看到积极性。不要害怕干活！不要抗拒工作！情绪要稳定。没有人会喜欢一个每天啥也不干的人。</p>"}]},{"date":"2026-06-16","notes":[{"title":"","raw":"中国ai科技一部落后步步落后，美国ai高速发展但是现在落地盈利较少。中国会不会发展其他产业来进行对抗。实体行业或者大基建？还是会在ai科技上面追赶。按照国人逻辑，应该会等他们创新后，吸收他们经验。来复制或者抄袭。","content":"<p>中国ai科技一部落后步步落后，美国ai高速发展但是现在落地盈利较少。中国会不会发展其他产业来进行对抗。实体行业或者大基建？还是会在ai科技上面追赶。按照国人逻辑，应该会等他们创新后，吸收他们经验。来复制或者抄袭。</p>"}]},{"date":"2026-06-12","notes":[{"title":"","raw":"上天给了我中上的相貌，中上的智商，中上的性格。就是希望我可以通过努力来获得自己想要的。所有的事情，通过努努力都可以做到中上。不要浪费了。","content":"<p>上天给了我中上的相貌，中上的智商，中上的性格。就是希望我可以通过努力来获得自己想要的。所有的事情，通过努努力都可以做到中上。不要浪费了。</p>"}]},{"date":"2026-06-09","notes":[{"title":"","raw":"06/10 交易规则 系统养成 var editingState = null; // null = new note, or { origDate, noteIndex }
var openDates = new Set();
var allExpanded = false;
var isSaving = false;

function pad2(n) {
  return String(n).padStart(2, "0");
}

function localTodayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function getMonthEndDate(ym) {
  var parts = ym.split("-");
  if (parts.length !== 2) return "";
  var y = parseInt(parts[0], 10);
  var m = parseInt(parts[1], 10);
  if (!y || !m) return "";
  var lastDay = new Date(y, m, 0).getDate();
  return y + "-" + pad2(m) + "-" + pad2(lastDay);
}

function weekdayLabel(dateStr) {
  var parts = dateStr.split("-");
  if (parts.length !== 3) return "";
  var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  if (isNaN(d.getTime())) return "";
  return ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function inlineMd(escaped) {
  return escaped
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

function renderMarkdown(rawText) {
  var parts = [];
  var paraLines = [];
  var inUl = false, inOl = false, inQuote = false;

  function flushPara() {
    if (paraLines.length) {
      parts.push("<p>" + paraLines.join("<br>") + "</p>");
      paraLines = [];
    }
  }

  function closeBlocks() {
    flushPara();
    if (inUl) { parts.push("</ul>"); inUl = false; }
    if (inOl) { parts.push("</ol>"); inOl = false; }
    if (inQuote) { parts.push("</blockquote>"); inQuote = false; }
  }

  String(rawText || "").trim().split("\n").forEach(function(rawLine) {
    var line = rawLine.trim();
    if (!line) {
      closeBlocks();
      return;
    }
    if (line.indexOf("# ") === 0) {
      closeBlocks();
      parts.push("<h3>" + inlineMd(escapeHtml(line.slice(2).trim())) + "</h3>");
      return;
    }
    if (line.indexOf("## ") === 0) {
      closeBlocks();
      parts.push("<h4>" + inlineMd(escapeHtml(line.slice(3).trim())) + "</h4>");
      return;
    }
    if (line.indexOf("> ") === 0) {
      flushPara();
      if (inUl) { parts.push("</ul>"); inUl = false; }
      if (inOl) { parts.push("</ol>"); inOl = false; }
      if (!inQuote) { parts.push("<blockquote>"); inQuote = true; }
      parts.push("<p>" + inlineMd(escapeHtml(line.slice(2).trim())) + "</p>");
      return;
    }
    if (line.indexOf("- ") === 0 || line.indexOf("* ") === 0) {
      flushPara();
      if (inOl) { parts.push("</ol>"); inOl = false; }
      if (inQuote) { parts.push("</blockquote>"); inQuote = false; }
      if (!inUl) { parts.push("<ul>"); inUl = true; }
      parts.push("<li>" + inlineMd(escapeHtml(line.slice(2).trim())) + "</li>");
      return;
    }
    var olMatch = line.match(/^(\d+)[\.\、]\s*(.+)$/);
    if (olMatch) {
      flushPara();
      if (inUl) { parts.push("</ul>"); inUl = false; }
      if (inQuote) { parts.push("</blockquote>"); inQuote = false; }
      if (!inOl) { parts.push("<ol>"); inOl = true; }
      parts.push("<li>" + inlineMd(escapeHtml(olMatch[2].trim())) + "</li>");
      return;
    }
    if (inUl || inOl || inQuote) closeBlocks();
    paraLines.push(inlineMd(escapeHtml(line)));
  });

  closeBlocks();
  return parts.join("\n");
}

function parseRawEntryMarkdown(raw) {
  var blocks = String(raw || "").trim().split(/\n\s*---\s*\n/).map(function(s) { return s.trim(); }).filter(Boolean);
  var noteList = [];
  blocks.forEach(function(block) {
    var lines = block.split("\n");
    var title = "";
    var bodyLines = lines;
    if (lines.length > 0 && lines[0].trim().indexOf("# ") === 0) {
      var rest = lines.slice(1).join("\n").trim();
      if (blocks.length > 1 || rest) {
        title = lines[0].trim().slice(2).trim();
        bodyLines = lines.slice(1);
      }
    }
    var rawBody = bodyLines.join("\n").trim() || block;
    if (noteList.length > 0 && noteList[noteList.length - 1].title === title && noteList[noteList.length - 1].raw === rawBody) {
      return; // Skip accidental duplicate consecutive blocks
    }
    noteList.push({
      title: title,
      raw: rawBody,
      content: renderMarkdown(rawBody)
    });
  });
  return noteList;
}

function serializeNotesToMarkdown(notes) {
  return notes.map(function(n) {
    var head = n.title ? "# " + n.title.trim() + "\n\n" : "";
    return head + (n.raw || "").trim();
  }).filter(Boolean).join("\n\n---\n\n");
}

function htmlToPlainText(html) {
  var tmp = document.createElement("div");
  tmp.innerHTML = html || "";
  return (tmp.textContent || tmp.innerText || "").trim();
}

function highlightHtml(safeHtml, needle) {
  if (!needle) return safeHtml;
  var escapedNeedle = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var regex = new RegExp("(" + escapedNeedle + ")", "gi");
  // Highlight text nodes only (outside HTML tags)
  return safeHtml.replace(/(>[^<]*<)/g, function(segment) {
    return segment.replace(regex, '<mark class="hl">$1</mark>');
  });
}

function updateStatsStrip() {

  var thisYm = localTodayStr().slice(0, 7);
  var monthNotes = ENTRIES.reduce(function(s, e) {
    return e.date.slice(0, 7) === thisYm ? s + ((e.notes || []).length || 0) : s;
  }, 0);

  document.getElementById("statDays").textContent = totalDays + " 天";
  document.getElementById("statNotes").textContent = totalNotes + " 篇";
  document.getElementById("statMonth").textContent = monthNotes + " 篇";

  var latestEl = document.getElementById("statLatest");
  if (!ENTRIES.length) {
    latestEl.textContent = "尚无记录";
  } else {
    var latestDate = ENTRIES[0].date;
    var today = localTodayStr();
    if (latestDate === today) {
      latestEl.textContent = "今日已省";
    } else {
      var d1 = new Date(today + "T00:00:00");
      var d0 = new Date(latestDate + "T00:00:00");
      var diff = Math.max(0, Math.round((d1 - d0) / 86400000));
      latestEl.textContent = diff === 1 ? "昨日已省" : diff + " 天前";
    }
  }
}

function getSearchQuery() {

function getVisibleEntries() {
  var from = document.getElementById("fromDate")?.value || "";
  var to = document.getElementById("toDate")?.value || "";
  var q = getSearchQuery().toLowerCase();

  var result = [];
  ENTRIES.forEach(function(e) {
    if (from && e.date < from) return;
    if (to && e.date > to) return;
    if (!q) {
      result.push(e);
      return;
    }
    if (e.date.toLowerCase().indexOf(q) !== -1) {
      result.push(e);
      return;
    }
    var matchedNotes = [];
    (e.notes || []).forEach(function(note, idx) {
      var hay = ((note.title || "") + "\n" + (note.raw || htmlToPlainText(note.content))).toLowerCase();
      if (hay.indexOf(q) !== -1) {
        matchedNotes.push(Object.assign({}, note, { _origIdx: idx }));
      }
    });
    if (matchedNotes.length) {
      result.push({ date: e.date, notes: matchedNotes });
    }
  });
  return result;
}

async function sha256(t) {
  var b = new TextEncoder().encode(t);
  var h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(function(x) { return x.toString(16).padStart(2, "0"); }).join("");
}

async function deriveKey(pw) {
  var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("journal-key:" + pw));
  return crypto.subtle.importKey("raw", h, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function decryptToken(pw) {
  if (!TOKEN) return null;
  try {
    var k = await deriveKey(pw);
    var raw = atob(TOKEN);
    var d = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) d[i] = raw.charCodeAt(i);
    var n = d.slice(0, 12), ct = d.slice(12);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: n }, k, ct);
    return new TextDecoder().decode(pt);
  } catch (e) {
    return null;
  }
}

function loadCachedEntries() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    var parsed = JSON.parse(raw);
    if (parsed && Array.isArray(parsed.entries) && parsed.entries.length >= ENTRIES.length) {
      ENTRIES = parsed.entries;
      return true;
    }
  } catch (e) {}
  return false;
}

async function completeUnlock(pw, persist7Days) {
  ghToken = await decryptToken(pw);
  try {
    sessionStorage.setItem(SESSION_PW_KEY, pw);
    if (persist7Days) {
      localStorage.setItem(REMEMBER_PW_KEY, JSON.stringify({
        pw: pw,
        exp: Date.now() + 7 * 86400 * 1000
      }));
    }
  } catch (e) {}

  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("newBtn").style.display = ghToken ? "inline-block" : "none";

  loadCachedEntries();
  if (ENTRIES.length > 0 && openDates.size === 0) {
    openDates.add(ENTRIES[0].date);
  }
  updateStatsStrip();
  render();
  reloadEntries();
}

async function unlock() {
  var pw = document.getElementById("pw").value;
  var h = await sha256(pw);
  if (h !== HASH) {
    document.getElementById("err").style.display = "block";
    return;
  }
  document.getElementById("err").style.display = "none";
  var remember = document.getElementById("rememberChk").checked;
  await completeUnlock(pw, remember);
}

  }

  visibleEntries.forEach(function(e) {

    var isOpen = Boolean(q) || openDates.has(e.date);

    var headerBtn = document.createElement("button");

    };

    var notesWrap = document.createElement("div");
    notesWrap.className = "notes-wrap" + (isOpen ? " open" : "");

    notes.forEach(function(note, idx) {
      var origIdx = typeof note._origIdx === "number" ? note._origIdx : idx;
      var nc = document.createElement("div");
      nc.className = "note-card";

      var topBar = document.createElement("div");
      topBar.className = "note-top" + (note.title ? "" : " no-title");
      if (note.title) {
        var tEl = document.createElement("div");
        tEl.className = "note-title";
        tEl.innerHTML = highlightHtml(escapeHtml(note.title), q);
        topBar.appendChild(tEl);
      }

      var copyBtn = document.createElement("button");

      bodyEl.innerHTML = highlightHtml("<div class=\"_w\">" + rendered + "</div>", q);
      nc.appendChild(bodyEl);
      notesWrap.appendChild(nc);
    });

    d.appendChild(headerBtn);
    d.appendChild(notesWrap);
    c.appendChild(d);
  });
}

function copyNoteText(date, note, btn) {

    var old = btn.textContent;
    btn.textContent = "已复制";
    setTimeout(function() { btn.textContent = old; }, 1400);
  });
}

async function reloadEntries() {
  setSyncStatus("同步中…", "busy");
  try {
    var headers = { Accept: "application/vnd.github+json" };
    if (ghToken) headers["Authorization"] = "Bearer " + ghToken;

    var r = await fetch("https://api.github.com/repos/" + REPO + "/contents/entries?t=" + Date.now(), {
      headers: headers,
      cache: "no-store"
    });
    if (!r.ok) {
      setSyncStatus("离线缓存", "");
      return;
    }
    var files = (await r.json()).filter(function(f) { return f && f.name && f.name.endsWith(".md"); });
    files.sort(function(a, b) { return b.name.localeCompare(a.name); });

    var prevShaMap = {};
    try {
      var savedCache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}");
      if (savedCache && savedCache.shaMap) prevShaMap = savedCache.shaMap;
    } catch (e) {}

    var nextShaMap = {};
    // Parallel incremental fetch: only download .md files whose SHA changed!
    var tasks = files.map(async function(f) {
      var date = f.name.replace(/\.md$/, "");
      var cached = prevShaMap[f.name];
      if (cached && cached.sha === f.sha && cached.entry) {
        nextShaMap[f.name] = cached;
        return cached.entry;
      }
      var cr = await fetch(f.download_url + (f.download_url.indexOf("?") === -1 ? "?s=" + f.sha : ""), { cache: "no-store" });
      if (!cr.ok) return cached ? cached.entry : null;
      var raw = await cr.text();
      var entry = { date: date, notes: parseRawEntryMarkdown(raw) };
      nextShaMap[f.name] = { sha: f.sha, entry: entry };
      return entry;
    });

    var resolved = (await Promise.all(tasks)).filter(function(e) { return e && e.notes && e.notes.length; });
    resolved.sort(function(a, b) { return b.date.localeCompare(a.date); });

    var wasEmptyOpen = openDates.size === 0;
    ENTRIES = resolved;
    if (wasEmptyOpen && ENTRIES.length > 0) {
      openDates.add(ENTRIES[0].date);
    }

    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        updatedAt: Date.now(),
        shaMap: nextShaMap,
        entries: ENTRIES
      }));
    } catch (e) {}

    setSyncStatus("已同步", "ok");
    render();
  } catch (e) {
    setSyncStatus("离线模式", "");
  }
}

function encodeUtf8Base64(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function decodeUtf8Base64(b64) {
  var bin = atob(b64.replace(/\s+/g, ""));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

async function fetchRemoteDayFile(date) {
  var r = await fetch("https://api.github.com/repos/" + REPO + "/contents/entries/" + date + ".md?t=" + Date.now(), {
    headers: { "Authorization": "Bearer " + ghToken, Accept: "application/vnd.github+json" },
    cache: "no-store"
  });
  if (r.status === 404) return { sha: null, raw: "" };
  if (!r.ok) throw new Error("读取远端记录失败 (" + r.status + ")");
  var d = await r.json();
  return { sha: d.sha, raw: decodeUtf8Base64(d.content || "").trim() };
}

async function putRemoteDayFile(date, finalMarkdown, sha, commitMsg) {
  var body = {
    message: commitMsg || ("journal " + date),
    content: encodeUtf8Base64(finalMarkdown.trim() + "\n"),
    branch: "master"
  };
  if (sha) body.sha = sha;
  var resp = await fetch("https://api.github.com/repos/" + REPO + "/contents/entries/" + date + ".md", {
    method: "PUT",
    headers: {
      "Authorization": "Bearer " + ghToken,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    var err = await resp.json().catch(function() { return {}; });
    throw new Error(err.message || ("保存失败 HTTP " + resp.status));
  }
}

async function saveEntry() {
  if (isSaving) return;
  var date = document.getElementById("edDate").value.trim();
  var title = document.getElementById("edTitle").value.trim();
  var content = document.getElementById("edContent").value.trim();
  var msg = document.getElementById("edMsg");
  var saveBtn = document.getElementById("saveBtn");

  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !content) {
    msg.className = "ed-msg err";
    msg.textContent = "请填写有效日期与自省内容。";
    return;
  }

  isSaving = true;
  saveBtn.disabled = true;
  saveBtn.textContent = "正在同步…";
  msg.className = "ed-msg";
  msg.textContent = "正在同步至 GitHub…";

  try {
    var remote = await fetchRemoteDayFile(date);
    var finalContent = "";

    if (editingState !== null) {
      var notes = remote.raw ? parseRawEntryMarkdown(remote.raw) : [];
      if (editingState.noteIndex >= 0 && editingState.noteIndex < notes.length) {
        notes[editingState.noteIndex] = { title: title, raw: content, content: renderMarkdown(content) };
      } else {
        notes.push({ title: title, raw: content, content: renderMarkdown(content) });
      }
      finalContent = serializeNotesToMarkdown(notes);
    } else {
      var newBlock = (title ? "# " + title + "\n\n" : "") + content;
      finalContent = (remote.sha && remote.raw) ? (remote.raw + "\n\n---\n\n" + newBlock) : newBlock;
    }

    await putRemoteDayFile(date, finalContent, remote.sha, "journal " + date);

    if (editingState === null) {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }
    openDates.add(date);
    msg.className = "ed-msg ok";
    msg.textContent = "已保存并同步！";
    cancelEdit();
    await reloadEntries();
  } catch (e) {
    msg.className = "ed-msg err";
    msg.textContent = "保存失败：" + (e.message || "网络异常");
  } finally {
    isSaving = false;
    saveBtn.disabled = false;
    saveBtn.textContent = "保存发布";
  }
}

async function deleteNote(date, noteIndex) {
  if (!ghToken || isSaving) return;
  if (!confirm("确定要删除 " + date + " 的这篇自省记录吗？此操作会同步更新到 GitHub 仓库。")) return;

  setSyncStatus("正在删除…", "busy");
  try {
    var remote = await fetchRemoteDayFile(date);
    if (!remote.sha) return;
    var notes = parseRawEntryMarkdown(remote.raw);
    notes.splice(noteIndex, 1);

    if (notes.length === 0) {
      var resp = await fetch("https://api.github.com/repos/" + REPO + "/contents/entries/" + date + ".md", {
        method: "DELETE",
        headers: {
          "Authorization": "Bearer " + ghToken,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "delete journal " + date,
          sha: remote.sha,
          branch: "master"
        })
      });
      if (!resp.ok) throw new Error("删除失败 HTTP " + resp.status);
    } else {
      var updatedMd = serializeNotesToMarkdown(notes);
      await putRemoteDayFile(date, updatedMd, remote.sha, "update journal " + date);
    }
    await reloadEntries();
  } catch (e) {
    alert("删除失败：" + (e.message || "网络错误"));
    setSyncStatus("同步异常", "");
  }
}

function exportMarkdown() {
  if (!ENTRIES.length) return;
  var lines = ["# 日省 · 个人自省全集", "", "> 导出日期：" + localTodayStr(), ""];
  ENTRIES.forEach(function(e) {
    lines.push("## " + e.date + " " + weekdayLabel(e.date));
    lines.push("");
    (e.notes || []).forEach(function(n, idx) {
      if (idx > 0) lines.push("---", "");
      if (n.title) lines.push("### " + n.title, "");
      lines.push(n.raw || htmlToPlainText(n.content), "");
    });
    lines.push("");
  });
  var blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "日省-全集备份-" + localTodayStr() + ".md";
  document.body.appendChild(a);
  a.click();
  setTimeout(function() {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 400);
}

// Auto-restore session if still valid
(async function tryAutoUnlock() {
  try {
    var sessionPw = sessionStorage.getItem(SESSION_PW_KEY);
    if (sessionPw && (await sha256(sessionPw)) === HASH) {
      await completeUnlock(sessionPw, false);
      return;
    }
    var remembered = JSON.parse(localStorage.getItem(REMEMBER_PW_KEY) || "null");
    if (remembered && remembered.pw && remembered.exp > Date.now()) {
      if ((await sha256(remembered.pw)) === HASH) {
        await completeUnlock(remembered.pw, false);
        return;
      }
    }
  } catch (e) {}
})();
