<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日省</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#999;font-family:Georgia,"Noto Serif SC",serif;-webkit-font-smoothing:antialiased}

#gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;gap:24px;background:linear-gradient(180deg,#0a0a0a 0%,#0d0d0d 50%,#0a0a0a 100%)}
#gate h2{font-size:48px;font-weight:400;color:#c9a84c;letter-spacing:16px;text-transform:uppercase}
#gate .sub{font-size:12px;color:#554820;letter-spacing:8px;margin-bottom:32px}
#gate input{background:#111;border:1px solid #222;color:#aaa;padding:16px 28px;font-size:14px;border-radius:4px;width:280px;outline:none;text-align:center;transition:border-color .3s}
#gate input:focus{border-color:#c9a84c}
#gate button{background:transparent;color:#c9a84c;border:1px solid #c9a84c;padding:14px 48px;font-size:13px;letter-spacing:4px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .3s}
#gate button:hover{background:#c9a84c;color:#0a0a0a}
#gate .err{color:#a04040;font-size:12px;display:none;letter-spacing:2px}

#app{display:none;max-width:680px;margin:0 auto;padding:80px 24px 160px}
header{padding-bottom:32px;margin-bottom:48px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:flex-end}
@media(max-width:640px){
  #gate h2{font-size:36px;letter-spacing:8px}
  #gate input{width:240px;padding:14px 20px}
  #gate button{padding:12px 36px}
  #app{padding:48px 20px 120px}
  header{flex-direction:column;align-items:flex-start;gap:16px}
  h1{font-size:24px}
  .entry::before{left:-16px}
  .entry-card{padding:24px}
}
h1{font-size:28px;font-weight:400;color:#c9a84c;letter-spacing:12px}
header p{color:#443;font-size:11px;letter-spacing:4px;text-transform:uppercase}
#newBtn{background:transparent;color:#665522;border:1px solid #222;padding:8px 22px;font-size:11px;letter-spacing:3px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .3s}
#newBtn:hover{color:#c9a84c;border-color:#c9a84c}

.entries{display:flex;flex-direction:column;gap:64px}

.entry{position:relative}
.entry::before{content:"";position:absolute;left:-24px;top:4px;width:1px;height:20px;background:#c9a84c;opacity:.3}
.entry-date{font-size:12px;color:#554420;letter-spacing:4px;margin-bottom:0;font-family:monospace;cursor:pointer;transition:color .3s;user-select:none;display:flex;align-items:center;gap:10px}
.entry-date:hover{color:#c9a84c}
.entry-date .arrow{display:inline-block;transition:transform .3s;font-size:9px;color:#c9a84c;opacity:.5}
.entry-date.open .arrow{transform:rotate(90deg)}
.entry-card{background:#0d0d0d;border:1px solid #161616;padding:36px;position:relative;display:none;margin-top:24px}
.entry-card::after{content:"";position:absolute;top:0;right:0;width:40px;height:1px;background:#c9a84c;opacity:.3}
.entry-content{font-size:15px;line-height:2.2;color:#888}
.entry-content p{margin-bottom:24px}
.entry-content p:last-child{margin-bottom:0}
.entry-content h3{color:#c9a84c;font-size:17px;font-weight:400;margin-bottom:16px;letter-spacing:2px}
.entry-content h4{color:#998;font-size:14px;font-weight:400;margin-bottom:12px}

footer{margin-top:120px;padding-top:40px;border-top:1px solid #1a1a1a;color:#333;font-size:10px;letter-spacing:3px;text-align:right}
</style>
</head>
<body>

<div id="gate">
  <h2>日省</h2>
  <div class="sub">DAILY REFLECTION</div>
  <input type="password" id="pw" placeholder="PASSWORD" autofocus>
  <button onclick="unlock()">ENTER</button>
  <div class="err" id="err">ACCESS DENIED</div>
</div>

<div id="app">
  <header>
    <div><h1>日省</h1><p>Daily Reflection</p></div>
    <button id="newBtn" onclick="startNew()">+ Write</button>
  </header>
  <div class="entries" id="entries"></div>
  <footer>GITHUB.COM/HANSHAOLONG881-LANG/JOURNAL</footer>
</div>

<script>
var HASH = "HASH_PLACEHOLD...";
var ENTRIES = ENTRIES_PLACEHOLDER;

async function sha256(t){
  var b = new TextEncoder().encode(t);
  var h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
}

async function unlock(){
  var pw = document.getElementById("pw").value;
  var h = await sha256(pw);
  if(h !== HASH){
    document.getElementById("err").style.display = "block";
    return;
  }
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
}

function render(){
  var c = document.getElementById("entries");
  ENTRIES.forEach(function(e){
    var d = document.createElement("div");
    d.className = "entry";
    d.innerHTML = '<div class="entry-date" onclick="toggleEntry(this)"><span class="arrow">&#9654;</span> '+e.date+'</div><div class="entry-card"><div class="entry-content">'+e.content+'</div></div>';
    c.appendChild(d);
  });
}

function toggleEntry(el){
  el.classList.toggle("open");
  var card = el.nextElementSibling;
  card.style.display = card.style.display === "block" ? "none" : "block";
}

function startNew(){ alert("Coming soon"); }

document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter") unlock();
});
</script>
</body>
</html>
