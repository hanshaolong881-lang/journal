<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日省</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:
    linear-gradient(90deg,rgba(3,3,4,.82) 0%,rgba(7,7,8,.62) 44%,rgba(3,3,4,.88) 100%),
    radial-gradient(circle at 26% 12%,rgba(201,168,76,.16),transparent 30%),
    url("./assets/maybach-s680-4k.jpg") center center / cover fixed no-repeat,
    #050505;
  color:#b0a99a;
  font-family:"LXGW WenKai Screen","Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  font-size:17px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  background-attachment:fixed;
}

#gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;gap:24px;background:linear-gradient(180deg,rgba(5,5,5,.82) 0%,rgba(10,10,10,.66) 50%,rgba(5,5,5,.9) 100%)}
#gate h2{font-size:48px;font-weight:400;color:#c9a84c;letter-spacing:16px;text-transform:uppercase}
#gate .sub{font-size:12px;color:#554820;letter-spacing:8px;margin-bottom:32px}
#gate input{background:#111;border:1px solid #222;color:#aaa;padding:16px 28px;font-size:14px;border-radius:4px;width:280px;outline:none;text-align:center;transition:border-color .3s}
#gate input:focus{border-color:#c9a84c}
#gate button{background:transparent;color:#c9a84c;border:1px solid #c9a84c;padding:14px 48px;font-size:13px;letter-spacing:4px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .3s}
#gate button:hover{background:#c9a84c;color:#0a0a0a}
#gate .err{color:#a04040;font-size:12px;display:none;letter-spacing:2px}

#app{display:none;max-width:820px;margin:0 auto;padding:86px 28px 160px}
header{padding-bottom:34px;margin-bottom:32px;border-bottom:1px solid #211d14;display:flex;justify-content:space-between;align-items:flex-end}
@media(max-width:640px){
  #gate h2{font-size:36px;letter-spacing:8px}
  #gate input{width:240px;padding:14px 20px}
  #gate button{padding:12px 36px}
  #app{padding:48px 20px 120px}
  header{flex-direction:column;align-items:flex-start;gap:16px}
  h1{font-size:30px}
  .filters{grid-template-columns:1fr}
  .filter-actions{justify-content:flex-start}
  .entry::before{left:-16px}
  .entry-card{padding:24px}
  .note-card{padding:24px}
}
h1{font-size:38px;font-weight:500;color:#d8b85f;letter-spacing:14px;text-shadow:0 0 24px rgba(201,168,76,.12)}
header p{color:#5f5131;font-size:12px;letter-spacing:4px;text-transform:uppercase}
#newBtn{background:transparent;color:#665522;border:1px solid #222;padding:8px 22px;font-size:11px;letter-spacing:3px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .3s}
#newBtn:hover{color:#c9a84c;border-color:#c9a84c}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:12px;
  align-items:end;
  margin:0 0 54px;
  padding:18px;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  box-shadow:0 24px 70px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(22px) saturate(145%);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
}
.filters label{display:grid;gap:8px;color:#7b6a3c;font-size:11px;letter-spacing:3px;text-transform:uppercase}
.filters input{
  min-height:42px;
  width:100%;
  border:1px solid rgba(255,255,255,.10);
  border-radius:2px;
  padding:0 12px;
  color:#d2c8af;
  background:rgba(0,0,0,.22);
  font:inherit;
  font-size:14px;
  outline:none;
}
.filters input:focus{border-color:#c9a84c;box-shadow:0 0 0 3px rgba(201,168,76,.08)}
.filter-actions{display:flex;gap:8px}
.filter-actions button{
  min-height:42px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.10);
  color:#b99f56;
  background:rgba(255,255,255,.035);
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
  letter-spacing:2px;
  transition:all .25s;
}
.filter-actions button:hover{border-color:#c9a84c;color:#d8b85f}
.filter-summary{grid-column:1/-1;color:#5d5133;font-size:12px;letter-spacing:1px;line-height:1.6}
.entries{display:flex;flex-direction:column;gap:72px}

.entry{position:relative}
.entry::before{content:"";position:absolute;left:-24px;top:4px;width:1px;height:28px;background:#c9a84c;opacity:.42}
.entry-date{font-size:15px;color:#786532;letter-spacing:4px;margin-bottom:0;font-family:"Cascadia Mono","SFMono-Regular",monospace;cursor:pointer;transition:color .3s;user-select:none;display:flex;align-items:center;gap:10px}
.entry-date:hover{color:#c9a84c}
.entry-date .arrow{display:inline-block;transition:transform .3s;font-size:11px;color:#c9a84c;opacity:.58}
.entry-date.open .arrow{transform:rotate(90deg)}
.entry-date .count{font-size:12px;color:#574b31;letter-spacing:1px}

.notes-wrap{display:none;margin-top:20px;flex-direction:column;gap:18px}
.notes-wrap.open{display:flex}

.note-card{
  overflow:hidden;
  background:
    linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035)),
    linear-gradient(180deg,rgba(201,168,76,.055),rgba(84,116,160,.035));
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:38px 46px;
  position:relative;
  box-shadow:0 22px 70px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
}
.note-card::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.16),transparent 28%,transparent 72%,rgba(201,168,76,.06));
  opacity:.72;
}
.note-card::after{content:"";position:absolute;top:0;right:0;width:92px;height:1px;background:rgba(255,255,255,.42);opacity:.72}
.note-card > *{position:relative;z-index:1}
.note-card .note-title{color:#d8b85f;font-size:18px;font-weight:500;letter-spacing:2px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #241f15}
.note-content{font-size:18px;line-height:2.08;color:#b6ad9a;letter-spacing:.2px}
.note-content p{margin-bottom:26px}
.note-content p:last-child{margin-bottom:0}
.note-content h3{color:#d8b85f;font-size:23px;font-weight:500;margin-bottom:18px;letter-spacing:2px}
.note-content h4{color:#b8aa80;font-size:19px;font-weight:500;margin-bottom:14px}
.note-content ul{margin-bottom:20px;padding-left:24px}
.note-content li{line-height:2;color:#a79d8a;margin-bottom:6px}
.empty-state{padding:48px 20px;border:1px dashed rgba(255,255,255,.13);border-radius:18px;color:#8b7844;text-align:center;letter-spacing:3px;font-size:13px;background:rgba(255,255,255,.035);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

footer{margin-top:120px;padding-top:40px;border-top:1px solid #1a1a1a;color:#333;font-size:10px;letter-spacing:3px;text-align:right}

#editor{display:none;margin-bottom:48px}
.ed-card{background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:30px;box-shadow:0 22px 70px rgba(0,0,0,.32);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)}
.ed-card label{display:block;color:#666;font-size:11px;letter-spacing:2px;margin-bottom:6px;text-transform:uppercase}
.ed-card input{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.10);color:#aaa;padding:10px 16px;font-size:12px;width:100%;outline:none;font-family:inherit;margin-bottom:12px;transition:border-color .3s}
.ed-card input:focus{border-color:#c9a84c}
.ed-card textarea{width:100%;min-height:200px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.10);color:#999;padding:16px;font-size:14px;margin:12px 0;outline:none;resize:vertical;line-height:2;font-family:inherit}
.ed-card textarea:focus{border-color:#c9a84c}
.ed-btns{display:flex;gap:10px}
.ed-btns button{padding:10px 28px;font-size:12px;letter-spacing:3px;cursor:pointer;font-family:inherit;text-transform:uppercase;transition:all .3s}
.btn-save{background:#c9a84c;color:#0a0a0a;border:1px solid #c9a84c}
.btn-save:hover{background:#b8960f}
.btn-cancel{background:transparent;color:#555;border:1px solid #222}
.btn-cancel:hover{color:#888;border-color:#444}
.ed-msg{font-size:11px;margin-top:12px;letter-spacing:1px}
.ed-msg.ok{color:#6a8}
.ed-msg.err{color:#a44}
</style>
</head>
<body>

<div id="gate">
  <h2>日省</h2>
  <div class="sub">DAILY REFLECTION</div>
  <input type="password" id="pw" placeholder="PASSWORD" autofocus>
  <button onclick="unlock()">ENTER</button>
  <div class="err" id="err">ACCESS DENIED</div>
</div>

<div id="app">
  <header>
    <div><h1>日省</h1><p>Daily Reflection</p></div>
    <button id="newBtn" onclick="startNew()">+ Write</button>
  </header>
  <section class="filters" aria-label="Date filters">
    <label>From
      <input type="date" id="fromDate" onchange="render()">
    </label>
    <label>To
      <input type="date" id="toDate" onchange="render()">
    </label>
    <label>Month
      <input type="month" id="monthFilter" onchange="setMonthFilter(this.value)">
    </label>
    <div class="filter-actions">
      <button type="button" onclick="showAllEntries()">ALL</button>
      <button type="button" onclick="showLatestMonth()">LATEST</button>
    </div>
    <div class="filter-summary" id="filterSummary"></div>
  </section>
  <div class="entries" id="entries"></div>

  <div id="editor">
    <div class="ed-card">
      <label>Date</label>
      <input type="text" id="edDate" placeholder="YYYY-MM-DD">
      <label>Title (optional)</label>
      <input type="text" id="edTitle" placeholder="e.g. 晨间反思 / 睡前自省 ...">
      <textarea id="edContent" placeholder="write here..."></textarea>
      <div class="ed-btns">
        <button class="btn-save" onclick="saveEntry()">SAVE</button>
        <button class="btn-cancel" onclick="cancelEdit()">CANCEL</button>
      </div>
      <div class="ed-msg" id="edMsg"></div>
    </div>
  </div>

  <footer>GITHUB.COM/HANSHAOLONG881-LANG/JOURNAL</footer>
</div>

<script>
var HASH = "HASH_PLACEHOLD...";
var TOKEN = "TOKEN_PLACEHO...";
var REPO = "hanshaolong881-lang/journal";
var ENTRIES = ENTRIES_PLACEHOLDER;
var ghToken = null;

function githubHeaders(includeContentType){
  var headers = {Accept:"application/vnd.github+json"};
  if(ghToken) headers.Authorization = "Bearer " + ghToken;
  if(includeContentType) headers["Content-Type"] = "application/json";
  return headers;
}

function getVisibleEntries(){
  var from = document.getElementById("fromDate")?.value || "";
  var to = document.getElementById("toDate")?.value || "";
  return ENTRIES.filter(function(e){
    if(from && e.date < from) return false;
    if(to && e.date > to) return false;
    return true;
  });
}

function updateFilterSummary(list){
  var summary = document.getElementById("filterSummary");
  if(!summary) return;
  var notes = list.reduce(function(sum,e){ return sum + ((e.notes || []).length || 0); }, 0);
  var from = document.getElementById("fromDate")?.value || "";
  var to = document.getElementById("toDate")?.value || "";
  var range = from || to ? (from || "earliest") + " → " + (to || "latest") : "all time";
  summary.textContent = list.length + " days · " + notes + " notes · " + range;
}

function setMonthFilter(value){
  if(!value){
    render();
    return;
  }
  document.getElementById("fromDate").value = value + "-01";
  var end = new Date(value + "-01T00:00:00");
  end.setMonth(end.getMonth() + 1);
  end.setDate(0);
  document.getElementById("toDate").value = end.toISOString().slice(0,10);
  render();
}

function showAllEntries(){
  document.getElementById("fromDate").value = "";
  document.getElementById("toDate").value = "";
  document.getElementById("monthFilter").value = "";
  render();
}

function showLatestMonth(){
  if(!ENTRIES.length) return;
  var latest = ENTRIES[0].date.slice(0,7);
  document.getElementById("monthFilter").value = latest;
  setMonthFilter(latest);
}

async function sha256(t){
  var b = new TextEncoder().encode(t);
  var h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
}

async function deriveKey(pw){
  var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("journal-key:"+pw));
  return crypto.subtle.importKey("raw", h, {name:"AES-GCM",length:256}, false, ["decrypt"]);
}

async function decryptToken(pw){
  if(!TOKEN) return null;
  try{
    var k = await deriveKey(pw);
    var raw = atob(TOKEN);
    var d = new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) d[i]=raw.charCodeAt(i);
    var n=d.slice(0,12), ct=d.slice(12);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:n}, k, ct);
    return new TextDecoder().decode(pt);
  }catch(e){ return null; }
}

async function unlock(){
  var pw = document.getElementById("pw").value;
  var h = await sha256(pw);
  if(h !== HASH){
    document.getElementById("err").style.display = "block";
    return;
  }
  ghToken = await decryptToken(pw);
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  if(!ghToken) document.getElementById("newBtn").style.display = "none";
  render();
  await reloadEntries();
}

function render(){
  var c = document.getElementById("entries");
  c.innerHTML = "";
  var visibleEntries = getVisibleEntries();
  updateFilterSummary(visibleEntries);
  if(!visibleEntries.length){
    c.innerHTML = '<div class="empty-state">NO ENTRIES IN THIS RANGE</div>';
    return;
  }
  visibleEntries.forEach(function(e){
    var d = document.createElement("div");
    d.className = "entry";
    
    var notes = e.notes || [];
    var countHtml = notes.length > 1 ? ' <span class="count">'+notes.length+' notes</span>' : '';
    
    var notesWrap = document.createElement("div");
    notesWrap.className = "notes-wrap";
    
    notes.forEach(function(note, idx){
      var nc = document.createElement("div");
      nc.className = "note-card";
      var titleHtml = note.title ? '<div class="note-title">'+note.title+'</div>' : '';
      nc.innerHTML = titleHtml + '<div class="note-content">'+note.content+'</div>';
      notesWrap.appendChild(nc);
    });
    
    d.innerHTML = '<div class="entry-date" onclick="toggleEntry(this)"><span class="arrow">&#9654;</span> '+e.date + countHtml + '</div>';
    d.appendChild(notesWrap);
    c.appendChild(d);
  });
}

function toggleEntry(el){
  el.classList.toggle("open");
  var wrap = el.parentElement.querySelector(".notes-wrap");
  if(wrap) wrap.classList.toggle("open");
}

function openFirstEntry(){
  var firstDate = document.querySelector(".entry-date");
  if(firstDate) toggleEntry(firstDate);
}

async function reloadEntries(){
  try{
    var r = await fetch("https://api.github.com/repos/"+REPO+"/contents/entries/",{
      headers:githubHeaders()
    });
    if(!r.ok) return;
    var files = await r.json();
    var dateMap = {};
    // sort files newest first
    files.sort(function(a,b){ return b.name.localeCompare(a.name); });
    for(var i=0;i<files.length;i++){
      var f = files[i];
      if(!f.name.endsWith(".md")) continue;
      var date = f.name.replace(".md","");
      var cr = await fetch(f.download_url);
      var raw = await cr.text();
      // Split by --- for multiple notes
      var notes = raw.split("\n---\n").filter(function(s){ return s.trim(); });
      
      var noteList = [];
      notes.forEach(function(note){
        note = note.trim();
        var lines = note.split("\n");
        var title = "";
        var bodyLines = [];
        if(lines.length > 0 && lines[0].startsWith("# ")){
          title = lines[0].slice(2);
          bodyLines = lines.slice(1);
        } else {
          bodyLines = lines;
        }
        var body = bodyLines.join("\n").trim() || note;
        var html = simpleMdToHtml(body);
        noteList.push({title: title, content: html});
      });
      dateMap[date] = {date: date, notes: noteList};
    }
    var dates = Object.keys(dateMap).sort().reverse();
    ENTRIES = dates.map(function(d){ return dateMap[d]; });
    document.getElementById("entries").innerHTML = "";
    render();
    openFirstEntry();
  }catch(e){}
}

function simpleMdToHtml(raw){
  var html = "";
  var inP = false, inUl = false;
  raw.split("\n").forEach(function(line){
    line = line.trim();
    if(!line){
      if(inP){ html += "</p>"; inP = false; }
      if(inUl){ html += "</ul>"; inUl = false; }
      return;
    }
    if(line.startsWith("# ")){
      if(inP){ html += "</p>"; inP = false; }
      if(inUl){ html += "</ul>"; inUl = false; }
      html += "<h3>" + line.slice(2) + "</h3>";
      return;
    }
    if(line.startsWith("## ")){
      if(inP){ html += "</p>"; inP = false; }
      if(inUl){ html += "</ul>"; inUl = false; }
      html += "<h4>" + line.slice(3) + "</h4>";
      return;
    }
    if(line.startsWith("- ")){
      if(inP){ html += "</p>"; inP = false; }
      if(!inUl){ html += "<ul>"; inUl = true; }
      html += "<li>" + line.slice(2) + "</li>";
      return;
    }
    if(inUl){ html += "</ul>"; inUl = false; }
    if(!inP){ html += "<p>"; inP = true; }
    html += line + " ";
  });
  if(inP) html += "</p>";
  if(inUl) html += "</ul>";
  return html;
}

function startNew(){
  if(!ghToken){ alert("Token not loaded"); return; }
  document.getElementById("edDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("edTitle").value = "";
  document.getElementById("edContent").value = "";
  document.getElementById("edMsg").textContent = "";
  document.getElementById("edMsg").className = "ed-msg";
  document.getElementById("editor").style.display = "block";
  window.scrollTo(0,0);
}

function cancelEdit(){
  document.getElementById("editor").style.display = "none";
}

async function saveEntry(){
  var date = document.getElementById("edDate").value.trim();
  var title = document.getElementById("edTitle").value.trim();
  var content = document.getElementById("edContent").value.trim();
  var msg = document.getElementById("edMsg");
  if(!date||!content){ msg.className="ed-msg err"; msg.textContent="Fill date and content"; return; }
  msg.className="ed-msg"; msg.textContent="Saving...";
  
  // Build the full note string
  var newBlock = "";
  if(title) newBlock += "# " + title + "\n\n";
  newBlock += content;
  
  try{
    // Check if file already exists
    var sha = null;
    var existingContent = "";
    try{
      var r = await fetch("https://api.github.com/repos/"+REPO+"/contents/entries/"+date+".md",{
        headers:githubHeaders()
      });
      if(r.ok){
        var d = await r.json();
        sha = d.sha;
        // Get existing content
        existingContent = atob(d.content.replace(/\n/g,""));
        try {
          existingContent = decodeURIComponent(escape(existingContent));
        } catch(e) {}
        existingContent = existingContent.trim();
      }
    }catch(e){}
    
    // If file exists, APPEND with --- separator
    var finalContent;
    if(sha && existingContent){
      finalContent = existingContent + "\n\n---\n\n" + newBlock;
    } else {
      finalContent = newBlock;
    }
    
    var body = {
      message: "journal " + date,
      content: btoa(unescape(encodeURIComponent(finalContent))),
      branch: "master"
    };
    if(sha) body.sha = sha;
    
    var resp = await fetch("https://api.github.com/repos/"+REPO+"/contents/entries/"+date+".md",{
      method:"PUT",
      headers:githubHeaders(true),
      body:JSON.stringify(body)
    });
    
    if(resp.ok){
      var action = sha ? "Appended" : "Saved";
      msg.className="ed-msg ok"; msg.textContent = action + "! Refreshing...";
      await reloadEntries();
      cancelEdit();
    }else{
      var err = await resp.json();
      msg.className="ed-msg err"; msg.textContent = "Error: "+(err.message||"unknown");
    }
  }catch(e){
    msg.className="ed-msg err"; msg.textContent = "Network error: "+e.message;
  }
}

document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter") unlock();
});
</script>
</body>
</html>
