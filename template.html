<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日省</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:"Noto Serif SC","Source Han Serif SC",Georgia,serif;min-height:100vh}
.container{max-width:680px;margin:0 auto;padding:60px 24px 120px}
header{border-bottom:1px solid #21262d;padding-bottom:32px;margin-bottom:32px;display:flex;justify-content:space-between;align-items:flex-end}
h1{font-size:28px;font-weight:400;color:#e6edf3;letter-spacing:2px}
header p{color:#8b949e;font-size:14px;margin-top:4px}
#newBtn{background:#238636;color:#fff;border:none;padding:8px 16px;font-size:13px;border-radius:6px;cursor:pointer}
#newBtn:hover{background:#2ea043}
#editor{display:none;margin-bottom:32px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px}
#editor input[type=text]{background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;font-size:16px;border-radius:6px;width:200px;outline:none}
#editor textarea{width:100%;min-height:200px;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:12px;font-size:15px;border-radius:6px;margin:12px 0;outline:none;resize:vertical;line-height:1.8;font-family:inherit}
#editor textarea:focus,#editor input:focus{border-color:#58a6ff}
.editor-btns{display:flex;gap:8px}
.editor-btns button{padding:8px 18px;font-size:13px;border-radius:6px;cursor:pointer;border:none}
.btn-save{background:#238636;color:#fff}
.btn-save:hover{background:#2ea043}
.btn-cancel{background:#21262d;color:#c9d1d9}
.btn-cancel:hover{background:#30363d}
.msg{font-size:13px;margin-top:8px}
.msg.ok{color:#3fb950}
.msg.err{color:#f85149}
.entries{display:flex;flex-direction:column;gap:40px}
.entry-date{font-size:12px;color:#484f58;letter-spacing:1px;margin-bottom:12px;text-transform:uppercase}
.entry-content{font-size:16px;line-height:1.9;color:#c9d1d9}
.entry-content p{margin-bottom:16px}
.entry-content p:last-child{margin-bottom:0}
.entry-content h3{color:#e6edf3;font-size:18px;margin-bottom:8px}
.entry-content h4{color:#c9d1d9;font-size:15px;margin-bottom:8px}
footer{margin-top:80px;padding-top:24px;border-top:1px solid #21262d;color:#484f58;font-size:12px}

#gate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
#gate h2{font-size:20px;font-weight:400;color:#e6edf3}
#gate input{background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:10px 16px;font-size:15px;border-radius:6px;width:240px;outline:none;text-align:center}
#gate input:focus{border-color:#58a6ff}
#gate button{background:#238636;color:#fff;border:none;padding:10px 24px;font-size:14px;border-radius:6px;cursor:pointer}
#gate button:hover{background:#2ea043}
#gate .error{color:#f85149;font-size:13px;display:none}
#app{display:none}
</style>
</head>
<body>

<div id="gate">
  <h2>日省</h2>
  <input type="password" id="pw" placeholder="输入密码" autofocus>
  <button onclick="unlock()">进入</button>
  <div class="error" id="error">密码错误</div>
</div>

<div id="app">
  <div class="container">
    <header>
      <div>
        <h1>日省</h1>
        <p>每日感悟 · 通杀牌</p>
      </div>
      <button id="newBtn" onclick="startNew()">+ 写日记</button>
    </header>

    <div id="editor">
      <input type="text" id="edDate" placeholder="日期 YYYY-MM-DD">
      <textarea id="edContent" placeholder="今天的感悟..."></textarea>
      <div class="editor-btns">
        <button class="btn-save" onclick="saveEntry()">保存并发布</button>
        <button class="btn-cancel" onclick="cancelEdit()">取消</button>
      </div>
      <div class="msg" id="edMsg"></div>
    </div>

    <div class="entries" id="entries"></div>
    <footer>github.com/hanshaolong881-lang/journal</footer>
  </div>
</div>

<script>
const PASSWORD_HASH = "{{PASSWORD_HASH}}";
const ENCRYPTED_TOKEN = "{{ENCRYPTED_TOKEN}}";
const REPO = "{{REPO}}";
const ENTRIES = {{ENTRIES}};
let ghToken = null;

async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function deriveKey(password) {
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("journal-key:" + password));
  return crypto.subtle.importKey("raw", hash, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function decryptToken(password) {
  if (!ENCRYPTED_TOKEN) return null;
  try {
    const key = await deriveKey(password);
    const data = Uint8Array.from(atob(ENCRYPTED_TOKEN), c => c.charCodeAt(0));
    const nonce = data.slice(0, 12);
    const ct = data.slice(12);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, ct);
    return new TextDecoder().decode(pt);
  } catch(e) {
    return null;
  }
}

async function unlock() {
  const pw = document.getElementById("pw").value;
  const hash = await sha256(pw);
  if (hash !== PASSWORD_HASH) {
    document.getElementById("error").style.display = "block";
    return;
  }
  // Decrypt token
  ghToken = await decryptToken(pw);
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  if (!ghToken) document.getElementById("newBtn").style.display = "none";
  render();
}

document.getElementById("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") unlock();
});

function render() {
  const container = document.getElementById("entries");
  container.innerHTML = "";
  ENTRIES.forEach(entry => {
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = '<div class="entry-date">' + entry.date + '</div><div class="entry-content">' + entry.content + '</div>';
    container.appendChild(div);
  });
}

// --- Editor ---
function startNew() {
  if (!ghToken) { alert("GitHub Token 未配置"); return; }
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("edDate").value = today;
  document.getElementById("edContent").value = "";
  document.getElementById("edMsg").textContent = "";
  document.getElementById("editor").style.display = "block";
  window.scrollTo(0, 0);
}

function cancelEdit() {
  document.getElementById("editor").style.display = "none";
}

async function saveEntry() {
  const date = document.getElementById("edDate").value.trim();
  const content = document.getElementById("edContent").value.trim();
  const msg = document.getElementById("edMsg");
  if (!date || !content) { msg.className = "msg err"; msg.textContent = "请填写日期和内容"; return; }

  msg.className = "msg"; msg.textContent = "保存中...";

  try {
    // Get current file to get SHA (for update)
    let sha = null;
    try {
      const getResp = await fetch("https://api.github.com/repos/" + REPO + "/contents/entries/" + date + ".md", {
        headers: { Authorization: "Bearer " + ghToken, Accept: "application/vnd.github+json" }
      });
      if (getResp.ok) {
        const getData = await getResp.json();
        sha = getData.sha;
      }
    } catch(e) {}

    const body = {
      message: "日记 " + date,
      content: btoa(unescape(encodeURIComponent(content))),
      branch: "master"
    };
    if (sha) body.sha = sha;

    const resp = await fetch("https://api.github.com/repos/" + REPO + "/contents/entries/" + date + ".md", {
      method: "PUT",
      headers: { Authorization: "Bearer " + ghToken, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (resp.ok) {
      msg.className = "msg ok"; msg.textContent = "已保存！GitHub Pages 正在部署...（约1分钟）";
      cancelEdit();
      // Rebuild locally via GitHub Actions or manual
    } else {
      const err = await resp.json();
      msg.className = "msg err"; msg.textContent = "保存失败：" + (err.message || "未知错误");
    }
  } catch(e) {
    msg.className = "msg err"; msg.textContent = "网络错误：" + e.message;
  }
}
</script>
</body>
</html>
