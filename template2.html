<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日省</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080a;color:#a8a4b0;font-family:Georgia,"Noto Serif SC",serif;-webkit-font-smoothing:antialiased}
#gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;gap:20px;background:radial-gradient(ellipse at 50% 30%,rgba(80,60,200,0.06),transparent 70%),#08080a}
#gate h2{font-size:56px;font-weight:400;color:#e8e4e0;letter-spacing:12px}
#gate .sub{font-size:14px;color:#5a5568;letter-spacing:6px;margin-bottom:24px}
#gate input{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:#c8c4c0;padding:14px 24px;font-size:15px;border-radius:12px;width:260px;outline:none;text-align:center}
#gate input:focus{border-color:rgba(180,160,220,0.3);background:rgba(255,255,255,0.05)}
#gate button{background:rgba(255,255,255,0.06);color:#d0cce0;border:1px solid rgba(255,255,255,0.08);padding:12px 32px;font-size:14px;border-radius:12px;cursor:pointer;font-family:inherit;letter-spacing:2px}
#gate button:hover{background:rgba(255,255,255,0.1)}
#gate .err{color:#c06060;font-size:13px;display:none}
#app{display:none;max-width:720px;margin:0 auto;padding:80px 28px 160px}
header{padding-bottom:48px;margin-bottom:64px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:flex-end}
h1{font-size:32px;font-weight:400;color:#e8e4e0;letter-spacing:8px}
header p{color:#5a5568;font-size:13px;letter-spacing:3px}
#newBtn{background:rgba(255,255,255,0.04);color:#a098b0;border:1px solid rgba(255,255,255,0.06);padding:8px 20px;font-size:12px;border-radius:10px;cursor:pointer;font-family:inherit;letter-spacing:1px}
#newBtn:hover{background:rgba(255,255,255,0.08);border-color:rgba(180,160,220,0.25);color:#d0cce0}
#editor{display:none;margin-bottom:48px}
.ed-shell{background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.05);border-radius:16px;padding:2px}
.ed-inner{background:rgba(0,0,0,0.3);border-radius:14px;padding:28px;border:1px solid rgba(255,255,255,0.03)}
#edDate{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);color:#c8c4c0;padding:10px 16px;font-size:13px;border-radius:8px;width:180px;outline:none;font-family:inherit}
#edDate:focus{border-color:rgba(180,160,220,0.25)}
#edContent{width:100%;min-height:240px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);color:#b0b0b8;padding:20px;font-size:15px;border-radius:8px;margin:16px 0;outline:none;resize:vertical;line-height:2;font-family:inherit}
#edContent:focus{border-color:rgba(180,160,220,0.25)}
.ed-btns{display:flex;gap:10px}
.ed-btns button{padding:10px 24px;font-size:13px;border-radius:10px;cursor:pointer;border:none;font-family:inherit;letter-spacing:1px}
.btn-save{background:rgba(140,120,200,0.15);color:#c8bce0;border:1px solid rgba(140,120,200,0.2)}
.btn-cancel{background:rgba(255,255,255,0.03);color:#6a6578;border:1px solid rgba(255,255,255,0.05)}
.msg{font-size:12px;margin-top:12px;letter-spacing:0.5px}
.msg.ok{color:#60a080}
.msg.err{color:#c06060}
.entries{display:flex;flex-direction:column;gap:56px}
.entry-date{font-size:11px;color:#3d3850;letter-spacing:3px;margin-bottom:20px}
.entry-content{font-size:16px;line-height:2.1;color:#a8a4b0}
.entry-content p{margin-bottom:20px}
.entry-content h3{color:#d0cce0;font-size:19px;font-weight:400;margin-bottom:12px}
footer{margin-top:120px;padding-top:32px;border-top:1px solid rgba(255,255,255,0.03);color:#3d3850;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>

<div id="gate">
  <h2>日省</h2>
  <div class="sub">TONG SHAPAI</div>
  <input type="password" id="pw" placeholder="密码" autofocus>
  <button onclick="unlock()">进入</button>
  <div class="err" id="err">密码错误</div>
</div>

<div id="app">
  <header>
    <div><h1>日省</h1><p>每日感悟</p></div>
    <button id="newBtn" onclick="startNew()">+ 写日记</button>
  </header>

  <div id="editor">
    <div class="ed-shell"><div class="ed-inner">
      <input type="text" id="edDate" placeholder="YYYY-MM-DD">
      <textarea id="edContent" placeholder="今天的感悟..."></textarea>
      <div class="ed-btns">
        <button class="btn-save" onclick="saveEntry()">保存</button>
        <button class="btn-cancel" onclick="cancelEdit()">取消</button>
      </div>
      <div class="msg" id="edMsg"></div>
    </div></div>
  </div>

  <div class="entries" id="entries"></div>
  <footer>github.com/hanshaolong881-lang/journal</footer>
</div>

<script>
var PASSWORD_HASH = "HASH_PLACEHOLDER";
var ENCRYPTED_TOKEN = "TOKEN_PLACEHOLDER";
var REPO = "hanshaolong881-lang/journal";
var ENTRIES = ENTRIES_PLACEHOLDER;
var ghToken = null;

async function sha256(t){
  var b = new TextEncoder().encode(t);
  var h = await crypto.subtle.digest("SHA-256", b);
  return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
}

async function deriveKey(pw){
  var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("journal-key:"+pw));
  return crypto.subtle.importKey("raw", h, {name:"AES-GCM",length:256}, false, ["decrypt"]);
}

async function decryptToken(pw){
  if(!ENCRYPTED_TOKEN) return null;
  try{
    var k = await deriveKey(pw);
    var d = new Uint8Array(atob(ENCRYPTED_TOKEN).split("").map(function(c){return c.charCodeAt(0)}));
    var n = d.slice(0,12), ct = d.slice(12);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:n}, k, ct);
    return new TextDecoder().decode(pt);
  }catch(e){ return null; }
}

async function unlock(){
  var pw = document.getElementById("pw").value;
  var h = await sha256(pw);
  if(h !== PASSWORD_HASH){
    document.getElementById("err").style.display = "block";
    return;
  }
  ghToken = await decryptToken(pw);
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  if(!ghToken) document.getElementById("newBtn").style.display = "none";
  render();
}

function render(){
  var c = document.getElementById("entries");
  c.innerHTML = "";
  ENTRIES.forEach(function(e){
    var d = document.createElement("div");
    d.innerHTML = '<div class="entry-date">'+e.date+'</div><div class="entry-content">'+e.content+'</div>';
    c.appendChild(d);
  });
}

function startNew(){
  if(!ghToken) return;
  document.getElementById("edDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("edContent").value = "";
  document.getElementById("edMsg").textContent = "";
  document.getElementById("editor").style.display = "block";
}
function cancelEdit(){ document.getElementById("editor").style.display = "none"; }

async function saveEntry(){
  var date = document.getElementById("edDate").value.trim();
  var content = document.getElementById("edContent").value.trim();
  var msg = document.getElementById("edMsg");
  if(!date||!content){ msg.className="msg err"; msg.textContent="请填写日期和内容"; return; }
  msg.className="msg"; msg.textContent="保存中...";
  try{
    var sha=null;
    try{
      var r=await fetch("https://api.github.com/repos/"+REPO+"/contents/entries/"+date+".md",{headers:{Authorization:"Bearer "+ghToken,Accept:"application/vnd.github+json"}});
      if(r.ok){ var d=await r.json(); sha=d.sha; }
    }catch(e){}
    var body={message:"日记 "+date,content:btoa(unescape(encodeURIComponent(content))),branch:"master"};
    if(sha) body.sha=sha;
    var resp=await fetch("https://api.github.com/repos/"+REPO+"/contents/entries/"+date+".md",{method:"PUT",headers:{Authorization:"Bearer "+ghToken,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
    if(resp.ok){ msg.className="msg ok"; msg.textContent="已保存，1分钟后生效"; }
    else{ var err=await resp.json(); msg.className="msg err"; msg.textContent="失败："+(err.message||"未知"); }
  }catch(e){ msg.className="msg err"; msg.textContent="网络错误："+e.message; }
}

document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter") unlock();
});
</script>
</body>
</html>
